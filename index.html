<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --canvas:#F4F5F8; --surface:#fff; --surface-2:#FAFBFC;
  --ink:#131726; --ink-2:#3A425B; --muted:#737D94;
  --line:#E3E6EE; --line-2:#EEF0F5;
  --azul:#2B3E8F; --azul-soft:#EDF0FB;
  --ambar:#B47614; --ambar-soft:#FBF3E2;
  --rojo:#C0392B; --rojo-soft:#FCEEEC;
  --verde:#12795A; --verde-soft:#E9F5F0;
  --display:'Archivo',sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* cada perfil con su ambiente: emprendedor neutro, sensor azulado, analista verdoso */
body[data-perfil="sensor"]{--canvas:#EDF1FA;--surface-2:#F6F8FD}
body[data-perfil="sensor"] header{border-top:3px solid var(--azul)}
body[data-perfil="analista"]{--canvas:#ECF3EF;--surface-2:#F5FAF7}
body[data-perfil="analista"] header{border-top:3px solid var(--verde)}
button,input,select,textarea{font-family:inherit;font-size:15px}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:5px}
.hide{display:none!important}
h1{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.3px;margin:0 0 4px}
h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 3px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:11.5px} .mono{font-family:var(--mono)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card.critico{border-color:#EBB6AD;box-shadow:0 1px 2px rgba(192,57,43,.08),0 10px 24px -18px rgba(192,57,43,.55)}
.card.resuelto{opacity:.72}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2);margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--canvas);color:var(--muted);border:1px solid var(--line)}
.chip.azul{background:var(--azul-soft);color:var(--azul);border-color:#D7DEF6}
.chip.rojo{background:var(--rojo-soft);color:var(--rojo);border-color:#F3D3CE}
.chip.verde{background:var(--verde-soft);color:var(--verde);border-color:#CFE7DE}
.chip.ambar{background:var(--ambar-soft);color:var(--ambar);border-color:#EEDFBD}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 14px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#242b47}
.btn.rec{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
textarea{resize:vertical}
.req{color:var(--rojo)}
.seg{display:flex;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px;background:var(--canvas)}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 10px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg.prio button[aria-pressed="true"].p-alta{background:var(--rojo)}
.seg.prio button[aria-pressed="true"].p-media{background:var(--ambar)}
.seg.prio button[aria-pressed="true"].p-baja{background:var(--ink)}

/* gate */
#gate{min-height:100vh;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-in{width:100%;max-width:560px}
.gbrand{font-family:var(--display);font-weight:700;font-size:19px;color:#000;letter-spacing:-.2px}
.gbrand em{font-style:normal;color:#1B2A6B}
.gh{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,31px);letter-spacing:-.6px;margin:18px 0 6px;line-height:1.15;color:var(--ink)}
.gp{color:var(--muted);margin:0 0 22px;font-size:14px}
.gcards{display:grid;gap:10px}
.gcard{text-align:left;background:#F1F3F7;border:1px solid #E1E5EC;color:var(--ink);border-radius:13px;padding:16px;cursor:pointer;transition:.15s}
.gcard:hover{background:#E8ECF3;border-color:#CDD4E0}
.gcard b{font-family:var(--display);font-size:16px;font-weight:600;display:block;margin-bottom:3px;color:var(--ink)}
.gcard span{font-size:13px;color:var(--muted)}
.gback{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:0;margin-top:16px}
.gback:hover{color:var(--ink)}
.gate label.f>span{color:var(--muted)}
.gate input{background:#fff;border-color:var(--line);color:var(--ink)}
.gate input::placeholder{color:#9AA3B5}


/* tareas fijas */
.barra{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .3s}
.row-av{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.row-av .pct{font-family:var(--display);font-weight:700;font-size:20px}
.tarea{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2)}
.tarea:last-child{border-bottom:0}
.tarea .txt{flex:1;min-width:0;font-size:14.5px}
.tarea .txt small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.tarea.ok .txt>div{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.marca{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);
  color:#fff;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;margin-top:1px}
.marca:hover{border-color:var(--verde)}
.marca.on{background:var(--verde);border-color:var(--verde)}
.tarea .ord{display:flex;flex-direction:column;gap:2px}
.tarea .ord button{padding:2px 6px;line-height:1.1;font-size:11px}
.pers{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:99px;padding:8px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;color:inherit;line-height:1.2}
.pers.edit{padding-right:8px;cursor:default}
.pers.mas{border-style:dashed;color:var(--azul);border-color:#C6D0EE;background:var(--azul-soft)}
.pers.mas:hover{background:#E2E8F8}
.pers.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pers .x{border:0;background:none;color:inherit;opacity:.5;cursor:pointer;font-size:12px;padding:0 2px}
.pers .x:hover{opacity:1;color:var(--rojo)}
.areaBtn{display:block}
.areaBtn:hover{border-color:#CCD3E2}
.btn.xs{font-size:12px;padding:5px 9px}


/* resumen compacto del emprendedor: 3 columnas horizontales */
.res3{display:grid;grid-template-columns:repeat(3,1fr);padding:0;overflow:hidden}
.rcol{border:0;background:none;border-right:1px solid var(--line-2);padding:11px 6px 10px;text-align:center;cursor:pointer;font-family:inherit;color:inherit}
.rcol:last-child{border-right:0}
.rcol:hover{background:var(--surface-2)}
.rnum{font-family:var(--display);font-weight:700;font-size:21px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.rnum .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.rlab{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}

/* selección de sustento (analista) */
.paso{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.paso .n{font-family:var(--mono);font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;flex:0 0 auto}
.paso b{font-size:14px}
.regsel{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.regsel:last-child{border-bottom:0}
.regsel input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--azul)}
.regsel .cuerpo{flex:1;min-width:0;font-size:13.5px}
.regsel .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
.sustento{background:var(--azul-soft);border:1px solid #D7DEF6;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:13px}
.sustento .eyebrow{color:var(--azul);margin-bottom:5px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed #D7DEF6;font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono)}

/* diálogos usables en celular */
dialog{max-height:92vh}
.dlg-in{max-height:calc(92vh - 4px);overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (max-width:480px){
  .rnum{font-size:19px}
  .seg button{padding:9px 6px;font-size:12.5px}
  .actions .btn{flex:1 1 auto}
}


/* tarjeta de reporte compacta */
.card.rep{padding:11px 13px;margin-bottom:9px}
.card.rep.noleido{background:#FCFDFF;border-color:#D7DEF6}
.rep-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rep-txt{font-size:13.5px;line-height:1.45;margin-top:6px;white-space:pre-wrap;color:var(--ink-2)}
.rep-pie{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
.btn-ver{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:12px;font-weight:500;
  color:var(--verde);background:var(--verde-soft);border:1px solid #CFE7DE;border-radius:99px;
  padding:5px 11px 5px 8px;cursor:pointer;line-height:1.3}
.btn-ver:hover{background:#DCEFE7;border-color:#B4D9CB}
.btn-ver .mas{display:grid;place-items:center;width:15px;height:15px;border-radius:50%;
  background:var(--verde);color:#fff;font-size:11px;font-weight:600;line-height:1}
.btn-preg{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:12px;font-weight:500;
  color:var(--azul);background:var(--azul-soft);border:1px solid #CBD5F0;border-radius:99px;
  padding:5px 11px 5px 9px;cursor:pointer;line-height:1.3}
.btn-preg:hover{background:#E2E8F8;border-color:#B4C2E8}
.btn-preg svg{width:14px;height:14px}
.btn-leida{font-family:inherit;font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;padding:5px 2px}
.btn-leida:hover{color:var(--ink)}


/* cartillas deslizables de incidentes */
.carrusel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.inc-mini{flex:0 0 min(76vw,270px);scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;
  font-family:inherit;color:inherit;text-align:left;cursor:pointer}
.inc-mini:active{transform:scale(.985)}
.inc-mini.critico{border-color:#EBB6AD;box-shadow:0 8px 20px -14px rgba(192,57,43,.5)}
.inc-mini.res{opacity:.6}
.im-top{display:flex;gap:6px;flex-wrap:wrap}
.im-txt .viv{display:block;font-style:normal;font-size:10px;color:var(--verde);font-family:var(--mono);margin-bottom:3px}
.im-txt{font-size:13.5px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.im-pie{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted);margin-top:auto}

.grid-dd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid-dd{grid-template-columns:1fr}}
/* actividades: un solo recuadro con filas */
.lista-acts{padding:3px 14px}
.act-row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);
  padding:11px 0;font-family:inherit;color:inherit;cursor:pointer}
.act-row:last-child{border-bottom:0}
.act-row:active{opacity:.7}
.ar-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ar-txt{display:block;font-size:13.5px;line-height:1.4;color:var(--ink)}

/* fila compacta de estado al pie de la ficha */
.est-fila{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line-2)}
.estb{border-radius:99px}
.estb.on-az{background:var(--azul);border-color:var(--azul);color:#fff}
.estb.on-vd{background:var(--verde);border-color:var(--verde);color:#fff}

/* diálogos centrados en todas las pantallas; en celular se ajustan al ancho */
@media (max-width:640px){
  dialog{width:calc(100vw - 28px);max-width:calc(100vw - 28px);border-radius:14px;max-height:86vh}
  .dlg-in{padding:16px}
  dialog::backdrop{background:rgba(17,21,36,.55)}
}


/* menú inferior del emprendedor */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:4px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 24px -16px rgba(17,21,36,.25)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:7px 4px 6px;border-radius:12px;
  color:var(--ink-2);font-family:inherit;cursor:pointer;position:relative}
.bnav button[aria-current="true"]{color:var(--azul);background:var(--azul-soft)}
.bnav svg{width:23px;height:23px}
.bnav .bl{font-size:11px;font-weight:600;letter-spacing:.01em;line-height:1}
.bnav .bdg{position:absolute;top:3px;left:calc(50% + 6px);background:var(--rojo);color:#fff;
  font-size:9.5px;font-family:var(--mono);border-radius:99px;padding:1.5px 5px;line-height:1.3;font-weight:500}


/* chat con claude: pantalla de chat real */
.chat-shell{display:flex;flex-direction:column;padding:0;overflow:hidden;
  height:calc(100dvh - 250px);min-height:420px;max-height:720px}
.chat-top{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2);background:var(--surface)}
.av-c{width:30px;height:30px;flex:0 0 auto;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:15px;line-height:1}
.av-c.grande{width:52px;height:52px;font-size:26px}
.chat-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.msg{display:flex;max-width:94%}
.msg.yo{align-self:flex-end;flex-direction:column;align-items:flex-end}
.msg.ia{align-self:flex-start;gap:8px;align-items:flex-start}
.msg.ia .av-c{margin-top:2px}
.mcol{display:flex;flex-direction:column;min-width:0}
.burb{padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.yo .burb{background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.msg.ia .burb{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.mst{font-size:10px;color:var(--muted);margin-top:3px}
.mfila{display:flex;align-items:center;gap:10px;margin-top:3px}
.btn-copiar{display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:11px;
  color:var(--muted);background:none;border:0;cursor:pointer;padding:2px 4px;border-radius:6px}
.btn-copiar:hover{color:var(--ink);background:var(--line-2)}
.btn-copiar svg{width:13px;height:13px}
.burb.escribiendo{display:flex;gap:4px;align-items:center;padding:13px 15px}
.burb.escribiendo i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pt 1.2s infinite}
.burb.escribiendo i:nth-child(2){animation-delay:.2s}
.burb.escribiendo i:nth-child(3){animation-delay:.4s}
@keyframes pt{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-vacio{margin:auto;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px}
.chat-comp{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line-2);background:var(--surface)}
.chat-comp textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 15px;resize:none;
  font-family:inherit;font-size:14px;line-height:1.4;max-height:120px;background:var(--surface)}
.chat-comp textarea:focus{outline:none;border-color:var(--azul)}
.btn-send{width:42px;height:42px;flex:0 0 auto;border-radius:50%;background:var(--ink);color:#fff;
  border:0;cursor:pointer;display:grid;place-items:center}
.btn-send:hover{background:var(--azul)}
.btn-send:disabled{opacity:.4;cursor:default}
.btn-send svg{width:18px;height:18px;margin-left:-2px}


/* tareas del día (asignadas por el emprendedor) */
.dia-card{border-color:#EAD9B0;background:#FFFDF6}
.tarea.dia.arr{background:#FFF6F4;border-radius:10px;margin:2px -6px;padding-left:6px;padding-right:6px}
.chip-arr{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--rojo);
  background:#FDE8E4;border:1px solid #F3C9C1;border-radius:99px;padding:1px 8px;margin:0 6px 3px 0;vertical-align:middle}
.tarea.dia.arr .marca{border-color:#E2A69B}
.tarea.sdel{opacity:.55}
.tarea.sdel .txt>div:last-child, .tarea.sdel .txt>div{text-decoration:line-through}
.tarea.sdel .txt .chip-del, .tarea.sdel .txt .chip-arr{text-decoration:none}
.chip-del{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--rojo);
  background:#FDE8E4;border:1px solid #F3C9C1;border-radius:99px;padding:1px 8px;margin:0 6px 3px 0;text-decoration:none}
.tarea.dia .marca{border-color:#D9BE85}
.tarea.dia .marca.on{background:var(--ambar);border-color:var(--ambar)}
/* hilo de seguimiento de un incidente */
.segui{border-left:3px solid var(--line);padding-left:11px;margin:12px 0 2px}
.seg-item{margin-bottom:8px}
.seg-item:last-child{margin-bottom:0}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-weight:700;font-size:15.5px}
.logo em{font-style:normal;color:var(--azul)}
.top .spacer{flex:1}
.uchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 5px;background:var(--surface);cursor:pointer;font-size:12.5px;max-width:52vw}
.uchip .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;background:var(--azul);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;font-family:var(--mono);flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:760px;margin:0 auto;padding:8px 14px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;color:var(--ink-2);cursor:pointer}
.tabs button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* vivo */
.vivo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--verde)}

<script>
/* =====================================================================
   FUSE OPS · Registro de Actividad → base central → emprendedor y analista
   Capa de datos v3:
   - TODO lo liviano vive en UNA sola clave (fuse-ops-db-v3): registros sin
     adjuntos, consultas y avisos. 1 lectura por refresco, 1 escritura por
     acción → sin lluvia de peticiones que dispare límites de tasa.
   - Los adjuntos (fotos/audio) van en su propia clave por registro
     (fuse-ops-media-<id>) y se cargan bajo demanda, con caché.
   - Toda escritura reintenta hasta 3 veces con espera creciente.
   ===================================================================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dormir=ms=>new Promise(r=>setTimeout(r,ms));
const AREAS={tienda:'Tienda / Despacho',prod:'Producción · Serigrafía',web:'Ventas Web'};
const SENSOR={tienda:'Sensor Tienda / Despacho',prod:'Sensor Producción',web:'Sensor Ventas Web'};
const AV={tienda:'T',prod:'P',web:'W'};
const K_DB='fuse-ops-db-v3', K_MEDIA='fuse-ops-media-';
const PRIO={alta:0,media:1,baja:2};
const TIPOS_AVISO=[
  'Recomendación de mejora',      // qué cambiar y por qué, con base en los datos
  'Riesgo detectado',             // algo que puede afectar la operación si no se atiende
  'Tendencia identificada',       // hacia dónde se está moviendo la operación
  'Patrón que se repite',         // un comportamiento recurrente en los registros
  'Aviso preventivo',             // anticiparse antes de que se convierta en problema
  'Balance de la operación'       // panorama general del periodo
];
const ESTADOS_INC=['abierto','revisado','resuelto'];

const iso=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hoyIso=()=>iso(Date.now());
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
function fmt(ts){
  const d=new Date(ts),h=pad(d.getHours())+':'+pad(d.getMinutes());
  if(iso(ts)===hoyIso())return 'Hoy '+h;
  const ayer=new Date();ayer.setDate(ayer.getDate()-1);
  if(iso(ts)===iso(ayer))return 'Ayer '+h;
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+h;
}

/* ---------- estado ---------- */
const VACIA_DB=()=>({registros:[],consultas:[],avisos:[],tareas:[],personas:[],checks:[]});
let DB=VACIA_DB();
const MEDIA=new Map();           // id → {fotos,audio} | 'cargando' | 'error'
const SES={perfil:null,area:null,nombre:null,tab:null,filtro:'',filtroTipo:'',verConsulta:null,
  ultRefresco:0,nuevas:new Set(),avisoRef:null,ultimoEnvio:0,guardando:false};
const DRAFT={tipo:'actividad',prioridad:'media',texto:'',fotos:[],audio:null,transcript:'',grabando:false};
let toastT=null;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800);}

/* ---------- almacenamiento: UNA sola base en el servidor ----------
   Todos los perfiles y dispositivos leen y escriben la misma base a través de
   /api/db y /api/media. No hay copias locales: si el servidor no responde, la
   app lo dice y no deja registrar, en vez de crear una base paralela.
   (Fuera de un servidor —por ejemplo en una vista previa— usa el almacén del
   visor, que en ese contexto también es único.)                              */
let BASE='iniciando';           // 'servidor' | 'visor' | 'sinConexion'
const MEMORIA=new Map();
const DIAG={motivo:'',detalle:'',http:null,enServidor:false};

async function probarServidor(){
  try{
    if(typeof location==='undefined'||!/^https?:$/.test(location.protocol))return false;
    DIAG.enServidor=true;
    let r=null;
    for(let intento=0;intento<3&&!r;intento++){
      try{
        const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),20000);
        r=await fetch('api/db',{signal:ctl.signal,cache:'no-store'});clearTimeout(t);
      }catch(err){
        if(intento===2)throw new Error('El servidor tardó demasiado en responder (arranque en frío o sin conexión).');
        await dormir(1200);
      }
    }
    DIAG.http=r.status;
    const txt=await r.text();
    if(r.status===404){
      DIAG.motivo='Las funciones del servidor no existen (404)';
      DIAG.detalle='Falta la carpeta api/ en el repositorio: sube api/db.js y api/media.js.';
      return false;
    }
    if(!r.ok){
      let msg=txt.slice(0,240);
      try{const j=JSON.parse(txt);if(j.error)msg=j.error;}catch(e){}
      DIAG.motivo=/storage|base de datos|upstash|redis/i.test(msg)
        ? 'Falta conectar la base de datos en Vercel'
        : 'El servidor respondió con error '+r.status;
      DIAG.detalle=msg;
      return false;
    }
    const j=JSON.parse(txt);
    if(!(j&&typeof j==='object'&&Array.isArray(j.registros))){
      DIAG.motivo='La respuesta del servidor no tiene el formato esperado';
      DIAG.detalle=txt.slice(0,240);
      return false;
    }
    DIAG.motivo='';DIAG.detalle='';
    return true;
  }catch(e){
    const m=String(e&&e.message||e);
    DIAG.motivo=/abort|tardó|timeout/i.test(m)?'El servidor no respondió a tiempo':'No se pudo contactar al servidor';
    DIAG.detalle=/abort|tardó|timeout/i.test(m)
      ?'Puede ser el arranque en frío de la función. Pulsa Reintentar; si insiste, revisa /api/estado.'
      :m;
    return false;
  }
}
async function elegirBase(){
  if(await probarServidor()){BASE='servidor';return;}
  if(!DIAG.enServidor){
    try{
      if(window.storage&&typeof window.storage.set==='function'){
        const k='fuse-ops-probe';
        if(await window.storage.set(k,'1',false)){
          try{await window.storage.delete(k,false)}catch(e){}
          BASE='visor';return;
        }
      }
    }catch(e){}
    BASE='visor';return;   // vista previa sin persistencia; sigue siendo una sola base
  }
  BASE='sinConexion';
}
const almacenListo=elegirBase();
async function reconectar(){
  toast('Conectando con la base…');
  await elegirBase();
  if(BASE==='sinConexion'){toast(DIAG.motivo||'El servidor no responde');render();return;}
  await cargarDB();toast('Conectado.');render();
}
function pantallaSinBase(){
  const pasos=DIAG.http===404
    ?['Sube al repositorio la carpeta api/ con db.js y media.js (Add file → Create new file, y escribe api/db.js para que se cree la carpeta).',
      'Espera a que Vercel redespliegue solo.']
    :['En Vercel, pestaña Storage → Marketplace Database Providers → Redis → Create → Upstash for Redis (plan Free).',
      'Abre la base creada → Connect Project → elige este proyecto → Connect.',
      'Pestaña Deployments → menú ⋯ del último despliegue → Redeploy. Sin este paso las credenciales no entran.'];
  return `<div class="card" style="border-color:#F3D3CE;background:#FFFCFB">
    <h1>La base de datos no responde</h1>
    <div class="sm" style="margin-top:4px">Para que todos los perfiles vean lo mismo, esta app guarda solo en el servidor.
      Mientras no conteste, no se registra nada: así ningún dato queda atrapado en un dispositivo suelto.</div>
    <div class="xs muted" style="margin-top:8px">${esc(DIAG.motivo||'Sin respuesta')} · api/db: ${DIAG.http==null?'sin respuesta':'HTTP '+DIAG.http}</div>
    ${DIAG.detalle?`<div class="transc" style="margin-top:8px">${esc(DIAG.detalle)}</div>`:''}
    <div class="eyebrow" style="margin:16px 0 6px">Cómo arreglarlo</div>
    <ol class="sm" style="margin:0;padding-left:18px">${pasos.map(p=>`<li style="margin-bottom:6px">${esc(p)}</li>`).join('')}</ol>
    <div class="xs muted" style="margin-top:10px">Para ver exactamente qué credenciales encuentra el servidor, abre
      <a href="api/estado" target="_blank" rel="noopener" class="mono">/api/estado</a>.</div>
    <div class="actions"><button class="btn primary" id="reconectar">Reintentar</button></div>
  </div>`;
}
async function rawGet(k){
  if(BASE==='servidor'){
    const url=k===K_DB?'api/db':'api/media?id='+encodeURIComponent(k.slice(K_MEDIA.length));
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),20000);
    const r=await fetch(url,{cache:'no-store',signal:ctl.signal});clearTimeout(t);
    if(r.status===404)return null;
    if(!r.ok)throw new Error('servidor '+r.status);
    return await r.text();
  }
  if(BASE==='sinConexion')throw new Error('sin base');
  try{
    if(window.storage&&typeof window.storage.get==='function'){
      const r=await window.storage.get(k,false);return r&&r.value!=null?r.value:null;
    }
  }catch(e){
    if(!/not found|404/i.test(String(e&&e.message||e)))throw e;
    return null;
  }
  return MEMORIA.has(k)?MEMORIA.get(k):null;
}
async function rawSet(k,json){
  if(BASE==='servidor'){
    const url=k===K_DB?'api/db':'api/media?id='+encodeURIComponent(k.slice(K_MEDIA.length));
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),25000);
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:json,signal:ctl.signal});clearTimeout(t);
    if(!r.ok)throw new Error('servidor '+r.status);
    /* el servidor fusiona y devuelve la base resultante: adoptarla evita pisar
       lo que otro perfil guardó un segundo antes */
    if(k===K_DB){try{const j=await r.json();if(j&&Array.isArray(j.registros))DB=j;}catch(e){}}
    return true;
  }
  if(BASE==='sinConexion')throw new Error('sin base');
  try{
    if(window.storage&&typeof window.storage.set==='function')return !!(await window.storage.set(k,json,false));
  }catch(e){}
  MEMORIA.set(k,json);return true;
}
async function sGet(k){
  await almacenListo;
  for(let i=0;i<3;i++){
    try{const v=await rawGet(k);return v?JSON.parse(v):null}
    catch(e){
      const msg=String(e&&e.message||e).toLowerCase();
      if(msg.includes('not found')||msg.includes('404'))return null;
      if(msg.includes('sin base'))return null;
      await dormir(350*(i+1));
    }
  }
  return null;
}
async function sSet(k,v){
  await almacenListo;
  /* mientras haya una escritura en vuelo, el sondeo no puede pisar la memoria;
     la marca de tiempo invalida además cualquier sondeo que ya estaba viajando */
  SES.escrituras=(SES.escrituras||0)+1;
  SES.ultimaEscritura=Date.now();
  try{
  const json=JSON.stringify(v);
  for(let i=0;i<3;i++){
    try{if(await rawSet(k,json))return true}
    catch(e){
      /* si el servidor se cayó a mitad de sesión, no inventamos una base local */
      if(String(e&&e.message||e).includes('sin base'))break;
    }
    await dormir(400*(i+1));
  }
  if(BASE==='servidor'){BASE='sinConexion';DIAG.motivo='Se perdió la conexión con el servidor';DIAG.detalle='El registro no se guardó. Reintenta cuando vuelva.';}
  return false;
  }finally{SES.escrituras=Math.max(0,(SES.escrituras||1)-1);}
}
async function cargarDB(){const v=await sGet(K_DB);if(v)DB={...VACIA_DB(),...v};}
async function guardarDB(){return sSet(K_DB,DB);}

/* ---------- registros ---------- */
async function guardarRegistro(reg,media){
  /* 1) el texto SIEMPRE entra: el registro liviano va a la clave única */
  reg.nFotos=media&&media.fotos?media.fotos.length:0;
  reg.hasAudio=!!(media&&media.audio);
  DB.registros.push(reg);
  /* alerta automática si es incidente de prioridad alta (misma escritura) */
  if(reg.tipo==='incidente'&&reg.prioridad==='alta'){
    DB.avisos.push({id:uid(),ts:reg.ts,origen:'sistema',tipoAviso:'Alerta preventiva',
      texto:'Incidente de prioridad ALTA en '+AREAS[reg.area]+': '+(reg.texto||reg.transcript||'ver detalle en Incidentes').slice(0,140),
      firma:'Regla automática',refIncidente:reg.id,leido:false});
  }
  const okDB=await guardarDB();
  if(!okDB){DB.registros=DB.registros.filter(r=>r.id!==reg.id);
    DB.avisos=DB.avisos.filter(a=>a.refIncidente!==reg.id);return {ok:false};}
  /* 2) los adjuntos van aparte; si fallan, el registro ya está a salvo */
  if(reg.nFotos||reg.hasAudio){
    const okM=await sSet(K_MEDIA+reg.id,{fotos:media.fotos||[],audio:media.audio||null});
    if(okM){MEDIA.set(reg.id,{fotos:media.fotos||[],audio:media.audio||null});return {ok:true,media:true};}
    reg.mediaPerdida=true;await guardarDB();
    return {ok:true,media:false};
  }
  return {ok:true,media:true};
}
/* carga diferida de adjuntos, de a pocos, solo cuando se muestran */
let cargandoMedia=false;
async function cargarMediaPendiente(){
  if(cargandoMedia)return;
  const pend=DB.registros.filter(r=>(r.nFotos||r.hasAudio)&&!r.mediaPerdida&&!MEDIA.has(r.id)).slice(0,3);
  if(!pend.length)return;
  cargandoMedia=true;
  for(const r of pend){
    MEDIA.set(r.id,'cargando');
    const m=await sGet(K_MEDIA+r.id);
    MEDIA.set(r.id,m||'error');
  }
  cargandoMedia=false;
  render();
}

/* refresco en vivo: UNA sola lectura */
const dlgAbierto=()=>{const d=document.querySelector('#dlg');return !!(d&&d.open)};
const escribiendo=()=>{const ae=document.activeElement;return !!(ae&&/^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName))};
async function refrescoVivo(){
  if(!SES.perfil||SES.guardando||SES.escrituras)return;
  /* con un diálogo abierto o un campo en uso, la base no se reemplaza:
     el diálogo guarda sobre el objeto que tiene en la mano y un reemplazo
     lo dejaría escribiendo en una copia huérfana */
  if(dlgAbierto()||escribiendo()||SES.empEdit||SES.editandoTareas||SES.editandoPersonas)return;
  if(BASE==='sinConexion')return;
  if(SES.perfil==='sensor'&&DRAFT.grabando)return;  // no interrumpir una grabación
  const previos=new Set(DB.registros.map(r=>r.id));
  const pedidoEn=Date.now();
  const v=await sGet(K_DB);
  /* revalidar TODO al aterrizar: guardados nuevos o un diálogo que se abrió
     mientras este sondeo viajaba invalidan la copia recibida */
  if(SES.guardando||SES.escrituras||(SES.ultimaEscritura&&SES.ultimaEscritura>=pedidoEn))return;
  if(dlgAbierto()||escribiendo()||SES.empEdit||SES.editandoTareas||SES.editandoPersonas)return;
  if(v){
    const nuevo={...VACIA_DB(),...v};

   ===================================================================== */
function comprimirFoto(file){
  /* FileReader→dataURL en vez de blob: — las URLs blob están bloqueadas en
     algunos entornos (visores embebidos con CSP estricta) y hacían fallar
     la carga. El dataURL funciona en todos. */
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onerror=()=>res(null);
    fr.onload=()=>{
      const original=fr.result;
      const img=new Image();
      img.onload=()=>{
        try{
          const MAX=720,e_=Math.min(1,MAX/Math.max(img.width||1,img.height||1));
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round((img.width||1)*e_));
          c.height=Math.max(1,Math.round((img.height||1)*e_));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          const salida=c.toDataURL('image/jpeg',.62);
          res(salida&&salida.length>50?salida:original);
        }catch(e){
          /* si el lienzo falla, se guarda la foto original mientras no sea enorme */
          res(original.length<1200000?original:null);
        }
      };
      img.onerror=()=>{
        /* el navegador no puede decodificarla (p. ej. HEIC fuera de Safari):
           si es liviana se guarda igual; si no, se avisa */
        res(original.length<1200000?original:null);
      };
      img.src=original;
    };
    fr.readAsDataURL(file);
  });
}
let mediaRec=null,recChunks=[],recStream=null,recStart=0,recTick=null,recog=null,recogFinal='';
async function iniciarGrabacion(){
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){return toast('No se pudo acceder al micrófono. Revisa los permisos del navegador.');}
  recChunks=[];recogFinal=DRAFT.transcript?DRAFT.transcript+' ':'';
  mediaRec=new MediaRecorder(recStream);
  mediaRec.ondataavailable=ev=>{if(ev.data.size)recChunks.push(ev.data)};
  mediaRec.onstop=()=>{
    const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
    const fr=new FileReader();
    fr.onload=()=>{DRAFT.audio={data:fr.result,dur:Math.round((Date.now()-recStart)/1000)};DRAFT.grabando=false;render();};
    fr.readAsDataURL(blob);
    recStream.getTracks().forEach(t=>t.stop());
  };
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    recog=new SR();recog.lang='es-PE';recog.continuous=true;recog.interimResults=true;
    recog.onresult=ev=>{
      let interim='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        if(ev.results[i].isFinal)recogFinal+=ev.results[i][0].transcript+' ';
        else interim+=ev.results[i][0].transcript;
      }
      DRAFT.transcript=(recogFinal+interim).trim();
      const el=$('#tr-live');if(el)el.textContent=DRAFT.transcript||'…';
    };
    try{recog.start()}catch(e){}
  }
  DRAFT.grabando=true;recStart=Date.now();
  mediaRec.start();
  recTick=setInterval(()=>{
    const el=$('#rec-t');const s=Math.round((Date.now()-recStart)/1000);
    if(el)el.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
    if(s>=120)detenerGrabacion();
  },300);
  render();
}
function detenerGrabacion(){
  clearInterval(recTick);
  if(recog){try{recog.stop()}catch(e){}recog=null;}
  if(mediaRec&&mediaRec.state!=='inactive')mediaRec.stop();
}

/* =====================================================================
   TAREAS FIJAS (POE) Y PERSONAS POR ÁREA
   - tareas: plantilla editable por área, con orden
   - personas: quiénes trabajan en cada área
   - checks: una marca por tarea y día, con quién la hizo
   El borrado es lógico (eliminada:true) para que la fusión del servidor
   no reviva lo que alguien borró desde otro dispositivo.
   ===================================================================== */
/* POE = tareas fijas recurrentes (sin fecha). Las "tareas del día" llevan
   tipoTarea:'dia' + fecha + responsable, las crea el emprendedor y viven
   junto al POE pero no lo alteran: el % de área sigue siendo solo POE. */
const tareasDe=a=>DB.tareas.filter(t=>t.area===a&&!t.eliminada&&t.tipoTarea!=='dia').sort((x,y)=>(x.orden||0)-(y.orden||0));
const tareasDia=(a,fecha)=>DB.tareas.filter(t=>t.area===a&&!t.eliminada&&t.tipoTarea==='dia'&&t.fecha===fecha).sort((x,y)=>(x.ts||0)-(y.ts||0));
/* una tarea del día que no se completó NO desaparece: rueda a los días
   siguientes como pendiente arrastrada (clave visual roja) hasta que
   alguien la marque o el emprendedor la quite */
const hechaAlguna=tid=>DB.checks.some(c=>c.tareaId===tid&&c.hecho);
function tareasDiaVisibles(a,hoy){
  const deHoy=tareasDia(a,hoy).map(t=>({...t,arrastrada:false}));
  const arrastradas=DB.tareas
    .filter(t=>t.area===a&&!t.eliminada&&t.tipoTarea==='dia'&&t.fecha&&t.fecha<hoy
      &&(hecha(t.id,hoy)||!hechaAlguna(t.id)))
    .sort((x,y)=>(x.fecha<y.fecha?-1:x.fecha>y.fecha?1:(x.ts||0)-(y.ts||0)))
    .map(t=>({...t,arrastrada:true}));
  return [...arrastradas,...deHoy];
}
const fmtDia=f=>{const pt=String(f||'').split('-');return pt[2]&&pt[1]?pt[2]+'/'+pt[1]:f};
function pendPorPersona(fecha){
  const m={};
  Object.keys(AREAS).forEach(a=>tareasDiaVisibles(a,fecha).forEach(t=>{
    const k=t.resp||'Sin responsable';
    if(!m[k])m[k]={pend:0,hechas:0,arr:0};
    if(hecha(t.id,fecha))m[k].hechas++;
    else{m[k].pend++;if(t.arrastrada)m[k].arr++;}
  }));
  return Object.entries(m).sort((x,y)=>y[1].pend-x[1].pend);
}
const personasDe=a=>DB.personas.filter(p=>p.area===a&&!p.eliminada).sort((x,y)=>x.nombre.localeCompare(y.nombre));
const idCheck=(tareaId,fecha)=>'chk_'+tareaId+'_'+fecha;
const checkDe=(tareaId,fecha)=>DB.checks.find(c=>c.id===idCheck(tareaId,fecha));
const hecha=(tareaId,fecha)=>{const c=checkDe(tareaId,fecha);return c&&c.hecho?c:null};
function avanceArea(a,fecha){
  const ts=tareasDe(a);
  const done=ts.filter(t=>hecha(t.id,fecha)).length;
  return {total:ts.length,done,pct:ts.length?Math.round(done/ts.length*100):0};
}
async function marcarTarea(tareaId,area,fecha,persona){
  const id=idCheck(tareaId,fecha);
  const ex=DB.checks.find(c=>c.id===id);
  const previo=ex?{...ex}:null;
  let marcado=false;
  if(ex){
    if(ex.hecho&&(!persona||persona===ex.persona)){ex.hecho=false;ex.persona='';}
    else{ex.hecho=true;ex.persona=persona||ex.persona||'';marcado=true;}
    ex.ts=Date.now();
  }else{
    DB.checks.push({id,tareaId,area,fecha,hecho:true,persona:persona||'',ts:Date.now(),marcadaPor:SES.nombre||''});
    marcado=true;
  }
  /* respuesta inmediata: la marca se ve al instante y la selección se limpia
     para que la siguiente tarea empiece desde cero */
  if(marcado)SES.personaSel=null;
  render();
  const t=DB.tareas.find(x=>x.id===tareaId);
  toast(marcado?('✓ '+((t&&t.texto)||'Tarea')+(persona?' · '+persona:'')):'Marca quitada');
  /* el guardado corre detrás, pausando el sondeo para que no pise la marca */
  SES.guardando=true;
  const ok=await guardarDB();
  SES.guardando=false;
  if(!ok){
    if(previo){const i=DB.checks.findIndex(c=>c.id===id);if(i>=0)DB.checks[i]=previo;}
    else DB.checks=DB.checks.filter(c=>c.id!==id);
    toast('No se pudo guardar la marca. Reintenta.');
    render();
  }
}

  const a=r.actualizaciones;

      <span class="chip ${r.prioridad==='alta'?'rojo':(r.prioridad==='media'?'ambar':'')}">${r.prioridad}</span>
      ${r.estado!=='abierto'?`<span class="chip ${cEstado}">${r.estado}</span>`:''}
    </span>
    <span class="im-txt">${(r.actualizaciones&&r.actualizaciones.length)?'<i class="viv">↻ Actualizado '+hhmm(r.actualizaciones[r.actualizaciones.length-1].ts)+'</i>':''}${esc(textoVivo(r))}</span>

    </span>

}
async function cambiarEstado(r,estado){
  const previo=r.estado;
  if(previo===estado)return;
  r.estado=estado;
  render();
  toast('Incidente marcado como '+estado);
  SES.guardando=true;
  const ok=await guardarDB();
  SES.guardando=false;
  if(!ok){r.estado=previo;toast('No se pudo guardar el cambio. Reintenta.');render();}
}

/* periodo de la vista diaria del emprendedor */
const enPeriodo=(ts,per)=>{
  if(per==='semana'){
    /* semana calendario: arranca el lunes 00:00 y el siguiente lunes empieza otra */
    const d=new Date();d.setHours(0,0,0,0);
    const dow=d.getDay();                       // 0=domingo
    d.setDate(d.getDate()-(dow===0?6:dow-1));   // retroceder hasta el lunes
    return ts>=d.getTime();
  }
  return iso(ts)===hoyIso();
};
function vEmpDiaria(){
  if(!SES.empPeriodo)SES.empPeriodo='hoy';
  if(!SES.actLim)SES.actLim=10;
  if(!SES.empDescPer)SES.empDescPer='hoy';
  const per=SES.empPeriodo,perTxt=per==='semana'?'esta semana':'hoy';
  const f=SES.filtro;
  /* un incidente pertenece al periodo por la fecha de CREACIÓN de su cartilla;
     los abiertos de fechas anteriores no desaparecen: se anuncian debajo y se
     muestran a pedido */
  const incTodosA=incidentes().filter(r=>!f||r.area===f);
  const inc=incTodosA.filter(r=>SES.incTodos?true:enPeriodo(r.ts,per)).sort((a,b)=>{
    const res=(a.estado==='resuelto')-(b.estado==='resuelto');
    if(res)return res;
    return (PRIO[a.prioridad]-PRIO[b.prioridad])||b.ts-a.ts;
  });

function statsBase(dias){
  const desde=Date.now()-(dias||7)*86400000;
  const rs=lista().filter(i=>i.ts>=desde);
  const por={};Object.keys(AREAS).forEach(a=>por[a]=rs.filter(i=>i.area===a).length);
  const incs=rs.filter(r=>r.tipo==='incidente');
  const stop=new Set('de la el en los las que una uno con por para del sin muy hay fue este esta hoy ayer mas más pero como cuando donde tiene hacer se un al lo su ya no si es era son están esta estaba'.split(' '));
  const freq={};
  rs.forEach(i=>String((i.texto||'')+' '+(i.transcript||'')).toLowerCase().replace(/[^a-záéíóúñü\s]/g,' ').split(/\s+/)
    .filter(w=>w.length>3&&!stop.has(w)).forEach(w=>freq[w]=(freq[w]||0)+1));
  const top=Object.entries(freq).filter(e=>e[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return {rs,por,top,incs};
}

function baseParaChat(){
  const rs=DB.registros.slice().sort((a,b)=>a.ts-b.ts).slice(-200);
  const lineas=rs.map(r=>'['+iso(r.ts)+' '+hhmm(r.ts)+'] '+r.tipo.toUpperCase()
    +(r.prioridad?'('+r.prioridad+', '+(r.estado||'abierto')+')':'')
    +' · '+(AREAS[r.area]||r.area)+' · '+(r.persona||'')+': '
    +String(r.texto||r.transcript||'(solo adjuntos)').replace(/\s+/g,' ').slice(0,220)
    +((r.actualizaciones&&r.actualizaciones.length)?' | SEGUIMIENTO: '+r.actualizaciones.map(x=>hhmm(x.ts)+' '+x.texto.replace(/\s+/g,' ')).slice(-3).join(' → ').slice(0,200):''));
  const hoy=hoyIso();
  const tf=Object.keys(AREAS).map(a=>{const av=avanceArea(a,hoy);
    return (AREAS[a]||a)+': '+(av.total?av.done+' de '+av.total+' ('+av.pct+'%)':'sin tareas')}).join(' · ');
  const marcas=DB.checks.filter(c=>c.hecho).slice(-80).map(c=>{
    const t=DB.tareas.find(x=>x.id===c.tareaId);
    return '['+c.fecha+' '+hhmm(c.ts)+'] '+(AREAS[c.area]||c.area)+' · "'+((t&&t.texto)||'tarea')+'" hecha por '+(c.persona||'sin asignar');
  });
  return 'Eres el copiloto de análisis de un analista de operaciones de FUSE, una PyME peruana de ropa con tres áreas: Tienda/Despacho, Producción·Serigrafía y Ventas Web. '
    +'Tu ÚNICA fuente es la data de abajo, recopilada en campo por sensores humanos. Responde en español peruano claro, directo y accionable, en texto plano sin Markdown. '
    +'Cita horas y áreas concretas cuando afirmes algo. Si la data no alcanza para responder, dilo sin inventar. Sé breve: el analista está trabajando en vivo.\n\n'
    +'=== REGISTROS ('+rs.length+' más recientes de '+DB.registros.length+' totales) ===\n'+(lineas.join('\n')||'(vacío)')
    +'\n\n=== TAREAS FIJAS (POE) DE HOY ===\n'+tf
    +(marcas.length?'\nMarcas: \n'+marcas.join('\n'):'')
    +'\n\n=== CONTEXTO ===\nConsultas del emprendedor: '+DB.consultas.length
    +' ('+DB.consultas.filter(c=>!c.respuesta).length+' sin responder) · Reportes enviados: '
    +DB.avisos.filter(a=>a.origen==='analista').length;
}

async function enviarChat(){
  const texto=(SES.chatDraft||'').trim();
  if(!texto)return toast('Escribe tu pregunta');
  if(SES.chatCargando)return;
  if(!SES.chat)SES.chat=[];
  SES.chat.push({role:'user',content:texto,ts:Date.now()});
  SES.chatDraft='';SES.chatCargando=true;
  render();window.scrollTo(0,document.body.scrollHeight);
  try{
    const r=await fetch('api/ia',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sistema:baseParaChat(),
        mensajes:SES.chat.map(m=>({role:m.role,content:m.content}))})});
    const j=await r.json().catch(()=>null);
    if(r.ok&&j&&j.texto){
      SES.chat.push({role:'assistant',content:j.texto,ts:Date.now()});
    }else if(j&&j.error==='sin_clave'){
      SES.chat.push({role:'assistant',content:'El chat aún no está conectado: falta la clave de Anthropic en Vercel.\n\nPasos: 1) console.anthropic.com → crear API key y cargar crédito. 2) Vercel → proyecto → Settings → Environment Variables → ANTHROPIC_API_KEY. 3) Deployments → Redeploy.\n\nMientras tanto, la Base de registros y la descarga siguen disponibles.',ts:Date.now()});
    }else{
      SES.chat.push({role:'assistant',content:'No pude completar el análisis: '+((j&&j.detalle)||'error de conexión')+'. Vuelve a intentarlo; tu pregunta sigue abajo por si quieres reenviarla.',ts:Date.now()});
      SES.chatDraft=texto;
    }
  }catch(e){
    SES.chat.push({role:'assistant',content:'No hay conexión con el servidor ahora mismo. Revisa tu internet y reintenta; tu pregunta sigue abajo.',ts:Date.now()});
    SES.chatDraft=texto;
  }
  SES.chatCargando=false;
  render();window.scrollTo(0,document.body.scrollHeight);
}

  }
  if(fu==='tareas'){
    return Object.keys(AREAS).map(a=>{
      const av=avanceArea(a,hoy);
      const color=av.total===0?'var(--muted)':(av.pct===100?'var(--verde)':(av.pct<50?'var(--rojo)':'var(--ambar)'));
      return `<div style="padding:9px 0;border-bottom:1px solid var(--line-2)">
        <div style="display:flex;align-items:baseline;gap:8px">
          <b class="sm" style="flex:1">${AREAS[a]}</b>
          <span class="mono xs muted">${av.total?av.done+' de '+av.total:'sin tareas'}</span>
          <b style="color:${color};font-family:var(--display)">${av.total?av.pct+'%':'—'}</b>
        </div>
        <div class="barra" style="margin-top:6px"><i style="width:${av.pct}%;background:${color}"></i></div>
      </div>`}).join('');
  }
  return '';   // proactivo/general no muestra cuadro: las cifras se adjuntan solas
}

function sustentoActual(){

   EXPORTACIÓN (CSV / JSON / resumen), REINICIO y DETALLE DE AVISO
   ===================================================================== */
const COLUMNAS=[
  ['fecha','Fecha',r=>iso(r.ts)],
  ['hora','Hora',r=>hhmm(r.ts)],
  ['dia_semana','Día',r=>['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][new Date(r.ts).getDay()]],
  ['franja','Franja',r=>{const h=new Date(r.ts).getHours();return h<12?'mañana':(h<18?'tarde':'noche')}],
  ['area','Área',r=>AREAS[r.area]||r.area],
  ['tipo','Tipo',r=>r.tipo==='incidente'?'Incidente':'Actividad'],
  ['prioridad','Prioridad',r=>r.prioridad||''],
  ['estado','Estado',r=>r.estado||''],
  ['persona','Reportado por',r=>r.persona||''],
  ['descripcion','Descripción',r=>r.texto||''],
  ['transcripcion','Transcripción del audio',r=>r.transcript||''],
  ['fotos','N° de fotos',r=>String(r.nFotos||0)],
  ['audio','Tiene audio',r=>r.hasAudio?'sí':'no'],
  ['seguimiento','Seguimiento del incidente',r=>(r.actualizaciones||[]).map(x=>'['+iso(x.ts)+' '+hhmm(x.ts)+'] '+x.texto).join(' | ')],
  ['recomendaciones','Recomendaciones del analista',r=>avisosDe(r.id).map(a=>a.tipoAviso+': '+a.texto).join(' | ')],
  ['id','ID',r=>r.id],
  ['fecha_hora_iso','Marca temporal ISO',r=>new Date(r.ts).toISOString()]
];
function csvDe(rs,sep){
  const cel=v=>{const t=String(v==null?'':v).replace(/\r?\n/g,' ').replace(/"/g,'""');
    return /["\n]|[,;\t]/.test(t)?'"'+t+'"':t;};
  const lineas=[COLUMNAS.map(c=>cel(c[1])).join(sep)];
  rs.forEach(r=>lineas.push(COLUMNAS.map(c=>cel(c[2](r))).join(sep)));
  return '\ufeff'+lineas.join('\r\n');
}
function resumenTexto(rs){
  const cuenta=(fn)=>{const m={};rs.forEach(r=>{const k=fn(r);if(k)m[k]=(m[k]||0)+1});
    return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const incs=rs.filter(r=>r.tipo==='incidente');
  const stop=new Set('de la el en los las que una uno con por para del sin muy hay fue este esta hoy ayer mas más pero como cuando donde tiene hacer se un al lo su ya no si es era son están esta estaba'.split(' '));
  const freq={};
  rs.forEach(r=>String((r.texto||'')+' '+(r.transcript||'')).toLowerCase().replace(/[^a-záéíóúñü\s]/g,' ')
    .split(/\s+/).filter(w=>w.length>3&&!stop.has(w)).forEach(w=>freq[w]=(freq[w]||0)+1));
  const top=Object.entries(freq).filter(e=>e[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const dias=new Set(rs.map(r=>iso(r.ts))).size;
  let t='RESUMEN DE REGISTROS — FUSE OPS\n';
  t+='Periodo cubierto: '+(rs.length?iso(rs[0].ts)+' a '+iso(rs[rs.length-1].ts):'sin registros')+'\n';
  t+='Generado: '+new Date().toLocaleString('es-PE')+'\n\n';
  t+='TOTALES\n';
  t+='Registros: '+rs.length+' ('+incs.length+' incidentes, '+(rs.length-incs.length)+' actividades)\n';
  t+='Días con reportes: '+dias+(dias?' · promedio '+(rs.length/dias).toFixed(1)+' registros por día':'')+'\n\n';
  t+='POR ÁREA\n'+(cuenta(r=>AREAS[r.area]).map(([k,v])=>'  '+k+': '+v+' ('+Math.round(v/rs.length*100)+'%)').join('\n')||'  sin datos')+'\n\n';
  t+='INCIDENTES POR PRIORIDAD\n'+(cuenta(r=>r.tipo==='incidente'?r.prioridad:null).map(([k,v])=>'  '+k+': '+v).join('\n')||'  sin incidentes')+'\n\n';
  t+='INCIDENTES POR ESTADO\n'+(cuenta(r=>r.tipo==='incidente'?r.estado:null).map(([k,v])=>'  '+k+': '+v).join('\n')||'  sin incidentes')+'\n\n';
  t+='POR FRANJA HORARIA\n'+(cuenta(r=>{const h=new Date(r.ts).getHours();return h<12?'mañana':(h<18?'tarde':'noche')}).map(([k,v])=>'  '+k+': '+v).join('\n')||'  sin datos')+'\n\n';
  t+='POR DÍA DE LA SEMANA\n'+(cuenta(r=>['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][new Date(r.ts).getDay()]).map(([k,v])=>'  '+k+': '+v).join('\n')||'  sin datos')+'\n\n';
  t+='QUIÉN REPORTA\n'+(cuenta(r=>r.persona).map(([k,v])=>'  '+k+': '+v).join('\n')||'  sin datos')+'\n\n';
  t+='TAREAS FIJAS DE HOY\n'+Object.keys(AREAS).map(a=>{const av=avanceArea(a,hoyIso());
    return '  '+AREAS[a]+': '+(av.total?av.done+' de '+av.total+' ('+av.pct+'%)':'sin tareas definidas')}).join('\n')+'\n\n';
  const hechas=DB.checks.filter(c=>c.hecho);
  if(hechas.length){
    const diasTF=new Set(hechas.map(c=>c.fecha)).size;
    t+='CUMPLIMIENTO DE TAREAS FIJAS (historial)\n';
    t+='  Marcas registradas: '+hechas.length+' en '+diasTF+' día(s)\n';
    Object.keys(AREAS).forEach(a=>{const n=hechas.filter(c=>c.area===a).length;if(n)t+='  '+AREAS[a]+': '+n+' tarea(s) completadas\n';});
    const porPers={};hechas.forEach(c=>{const k=c.persona||'sin asignar';porPers[k]=(porPers[k]||0)+1});
    t+='  Por persona: '+Object.entries(porPers).sort((x,y)=>y[1]-x[1]).map(([k,v])=>k+' ('+v+')').join(', ')+'\n\n';
  }
  t+='PALABRAS QUE SE REPITEN\n'+(top.map(([k,v])=>'  '+k+': '+v).join('\n')||'  ninguna se repite todavía')+'\n\n';
  t+='DETALLE CRONOLÓGICO\n';
  rs.forEach(r=>{t+=fmt(r.ts)+' · '+AREAS[r.area]+' · '+r.persona+' · '+(r.tipo==='incidente'?'INCIDENTE ('+r.prioridad+', '+r.estado+')':'actividad')+
    ': '+(r.texto||'')+(r.transcript?' [audio: '+r.transcript+']':'')+'\n'});
  return t;
}
function csvTareas(sep){
  const cel=v=>{const t=String(v==null?'':v).replace(/\r?\n/g,' ').replace(/"/g,'""');
    return /["\n]|[,;\t]/.test(t)?'"'+t+'"':t;};
  const cab=['Fecha','Área','Tarea','Estado','Hecha por','Hora','Marcada desde el perfil de','ID tarea'];
  const filas=[cab.map(cel).join(sep)];
  /* una fila por tarea y día con actividad: hechas y también las desmarcadas quedan como pendientes */
  const marcas=DB.checks.slice().sort((a,b)=>(a.fecha+'').localeCompare(b.fecha)||(a.ts||0)-(b.ts||0));
  marcas.forEach(c=>{
    const t=DB.tareas.find(x=>x.id===c.tareaId);
    filas.push([c.fecha,AREAS[c.area]||c.area,(t&&t.texto)||'(tarea eliminada)',
      c.hecho?'hecha':'pendiente',c.hecho?(c.persona||'sin asignar'):'',
      c.hecho?hhmm(c.ts):'',c.marcadaPor||'',c.tareaId].map(cel).join(sep));
  });
  return '\ufeff'+filas.join('\r\n');
}
function descargar(nombre,texto,mime){
  const blob=new Blob([texto],{type:(mime||'text/plain')+';charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function selloArchivo(){
  const d=new Date();
  return iso(d.getTime())+'_'+pad(d.getHours())+pad(d.getMinutes());
}
function filtrarDescarga(F){
  return DB.registros.filter(r=>{
    if(F.fecha&&iso(r.ts)!==F.fecha)return false;
    const h=hhmm(r.ts);
    if(F.hini&&h<F.hini)return false;
    if(F.hfin&&h>F.hfin)return false;
    if(F.sensor&&r.persona!==F.sensor)return false;
    return true;
  }).sort((a,b)=>a.ts-b.ts);
}
function nombreDescarga(F,ext){
  const limpio=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase()||'todos';
  const hora=t=>t?t.replace(':','')+'h':'';
  const rango=(F.hini||F.hfin)?('_'+(hora(F.hini)||'0000h')+'-'+(hora(F.hfin)||'2359h')):'';
  return 'fuse-ops_'+(F.sensor?limpio(F.sensor):'todos')+'_'+(F.fecha||iso(Date.now()))+rango+'.'+ext;
}

async function reiniciarPlataforma(){
  try{
    if(BASE==='servidor'){
      const r=await fetch('api/db',{method:'DELETE'});
      if(!r.ok)throw new Error('servidor '+r.status);
      const j=await r.json();
      DB=VACIA_DB();
      MEDIA.clear();
      toast('Plataforma reiniciada'+(j.adjuntosBorrados?' · '+j.adjuntosBorrados+' adjunto(s) eliminados':''));
    }else{
      DB=VACIA_DB();
      MEDIA.clear();
      await guardarDB();
      toast('Plataforma reiniciada');
    }
    SES.filtro='';SES.filtroTipo='';SES.avisoRefs=new Set();
    render();
  }catch(e){toast('No se pudo reiniciar: '+String(e.message||e));}

const TABS={
  sensor:[['reportar','Registrar'],['fijas','Tareas fijas']],
  emprendedor:[['diaria','Actividad diaria'],['fijas','Tareas fijas'],['analista','Reporte analista']],
  analista:[['consultas','Consultas'],['aviso','Enviar reporte'],['chat','Chat con Claude'],['base','Base de registros']]
};
function badges(k){
  if(SES.perfil==='emprendedor'){
    if(k==='diaria')return incidentes().filter(r=>r.estado!=='resuelto'&&r.prioridad==='alta').length;
    if(k==='analista')return DB.avisos.filter(a=>!a.leido).length;
  }
  if(SES.perfil==='sensor'&&k==='fijas'){
    const av=avanceArea(SES.area,hoyIso());
    const dia=tareasDiaVisibles(SES.area,hoyIso()).filter(t=>!hecha(t.id,hoyIso())).length;
    return (av.total-av.done)+dia;
  }
  if(SES.perfil==='analista'&&k==='consultas')return DB.consultas.filter(c=>!c.respuesta).length;
  return 0;
}
function render(){
  document.body.dataset.perfil=SES.perfil||'';
  if(!SES.perfil)return;
  const tabs=TABS[SES.perfil];
  if(!SES.tab)SES.tab=tabs[0][0];
  $('#switch').classList.toggle('hide',!!SES.fijo);
  $('#uav').textContent=SES.perfil==='sensor'?AV[SES.area]:(SES.perfil==='analista'?'A':'E');
  $('#uwho').textContent=SES.perfil==='sensor'?SES.nombre+' · '+SENSOR[SES.area]
    :(SES.perfil==='analista'?'Analista · '+SES.nombre:'Emprendedor');
  const esEmp=SES.perfil==='emprendedor';
  $('#tabs').innerHTML=(esEmp||tabs.length<2)?'':tabs.map(t=>{const b=badges(t[0]);
    return `<button data-tab="${t[0]}" aria-current="${t[0]===SES.tab}">${t[1]}${b?' · '+b:''}</button>`}).join('');
  const ICONOS={
    diaria:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    fijas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>',
    analista:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg>'};
  const ETQ={diaria:'Actividad',fijas:'Tareas',analista:'Analista'};
  $('#bnav').classList.toggle('hide',!esEmp);
  if(esEmp){
    $('#bnav').innerHTML=tabs.map(t=>{const b=badges(t[0]);
      return `<button data-tab="${t[0]}" aria-current="${t[0]===SES.tab}">
        ${ICONOS[t[0]]||''}${b?`<span class="bdg">${b}</span>`:''}
        <span class="bl">${ETQ[t[0]]||t[1]}</span>
      </button>`}).join('');
  }
  const V={'sensor/reportar':vSensor,'sensor/fijas':vSensorFijas,
    'emprendedor/diaria':vEmpDiaria,'emprendedor/fijas':vEmpFijas,'emprendedor/analista':vEmpAnalista,
    'analista/consultas':vAnConsultas,'analista/aviso':vAnAviso,'analista/chat':vAnChat,'analista/base':vAnBase};
  $('#view').innerHTML=BASE==='sinConexion'?pantallaSinBase():V[SES.perfil+'/'+SES.tab]();
  const _cs=$('#chat-scroll');if(_cs)_cs.scrollTop=_cs.scrollHeight;
  SES.nuevas.clear();
  if(SES.perfil!=='sensor')cargarMediaPendiente();
}
/* enlace directo: ?perfil=emprendedor entra sin selector y sin acceso a otros perfiles */
function perfilDeEnlace(){
  try{
    const q=new URLSearchParams(location.search).get('perfil')||location.hash.replace('#','');
    return ['emprendedor','analista','sensor'].includes(q)?q:null;
  }catch(e){return null}
}
async function entrar(perfil){
  SES.perfil=perfil;SES.tab=null;SES.verConsulta=null;SES.avisoRefs=new Set();SES.avisoFuente='proactivo';SES.avisoFiltroArea='';
  $('#gate').classList.add('hide');$('#app').classList.remove('hide');
  window.scrollTo(0,0);
  await cargarDB();
  SES.ultRefresco=Date.now();
  if(perfil==='emprendedor'){DB.consultas.forEach(c=>{if(c.respuesta)c.vista=true});}
  render();
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
/* arranque: si el enlace trae perfil, se salta la pantalla de selección */
(function arranque(){
  const p=perfilDeEnlace();
  if(p==='emprendedor'){SES.fijo=true;entrar('emprendedor');}
})();

document.addEventListener('click',async e=>{
  const img=e.target.closest('img[data-verfoto],img[data-ampliar]');
  if(img){
    $('#dlg-in').innerHTML=`<img class="full" src="${img.src}" alt="Foto del registro"><div class="actions"><button class="btn" id="dlg-x">Cerrar</button></div>`;
    $('#dlg').showModal();$('#dlg-x').onclick=()=>$('#dlg').close();return;
  }
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;

  /* gate */
  if(d.g==='sensor'){$('#g1').classList.add('hide');$('#g2').classList.remove('hide');return;}
  if(d.g==='analista'){$('#g1').classList.add('hide');$('#g3').classList.remove('hide');return;}
  if(d.g==='emprendedor')return entrar('emprendedor');
  if(d.back){$('#g2').classList.add('hide');$('#g3').classList.add('hide');$('#g1').classList.remove('hide');return;}
  if(d.sensor){const n=$('#g-nombre').value.trim();if(!n)return toast('Escribe tu nombre debajo de los sensores');
    SES.area=d.sensor;SES.nombre=n;return entrar('sensor');}
  if(b.id==='g-entrar-an'){const n=$('#g-nombre-an').value.trim();if(!n)return toast('Escribe tu nombre');
    SES.nombre=n;return entrar('analista');}
  if(b.id==='reconectar')return reconectar();
  if(b.id==='switch'){
    if(SES.fijo)return;
    if(DRAFT.grabando)detenerGrabacion();
    SES.perfil=null;document.body.dataset.perfil='';
    $('#app').classList.add('hide');$('#gate').classList.remove('hide');
    $('#g2').classList.add('hide');$('#g3').classList.add('hide');$('#g1').classList.remove('hide');window.scrollTo(0,0);return;}
  if(d.tab){SES.tab=d.tab;SES.verConsulta=null;window.scrollTo(0,0);return render();}

  /* sensor */
  if(d.tipo){DRAFT.texto=$('#s-texto')?$('#s-texto').value:DRAFT.texto;DRAFT.tipo=d.tipo;return render();}
  if(d.prio){DRAFT.texto=$('#s-texto')?$('#s-texto').value:DRAFT.texto;DRAFT.prioridad=d.prio;return render();}
  if(b.id==='s-grabar')return iniciarGrabacion();
  if(b.id==='s-stop')return detenerGrabacion();
  if(b.id==='s-regrabar'){DRAFT.audio=null;return render();}
  if(d.qfoto!=null){DRAFT.texto=$('#s-texto').value;DRAFT.fotos.splice(Number(d.qfoto),1);return render();}
  if(b.id==='s-enviar')return enviarRegistro();

  /* filtros compartidos */
  if(d.fa!=null){SES.filtro=d.fa;SES.actLim=10;return render();}
  if(d.per){SES.empPeriodo=d.per;SES.actLim=10;SES.incTodos=false;return render();}
  if(b.id==='inc-vermas'){SES.incTodos=!SES.incTodos;return render();}
  if(d.descper){SES.empDescPer=d.descper;return render();}
  if(b.id==='act-mas'){SES.actLim=(SES.actLim||10)+10;return render();}
  if(d.ft!=null){SES.filtroTipo=d.ft;return render();}

  /* enlace directo */
  if(b.id==='copiar-enlace'){
    const url=location.origin+location.pathname+'?perfil=emprendedor';
    return navigator.clipboard.writeText(url).then(()=>toast('Enlace copiado')).catch(()=>toast(url));
  }

  /* tareas fijas · sensor */
  if(b.id==='pers-editar'){SES.editandoPersonas=!SES.editandoPersonas;return render();}
  if(d.pers){SES.personaSel=SES.personaSel===d.pers?null:d.pers;return render();}
  if(b.id==='pers-add'){
    $('#dlg-in').innerHTML=`<div class="eyebrow">${AREAS[SES.area]}</div>
      <h2 style="margin:4px 0 10px">Agregar persona</h2>
      <label class="f"><span>Nombre <i class="req">*</i></span><input id="pn" placeholder="Nombre y apellido"></label>
      <div class="actions"><button class="btn primary" id="pn-ok">Agregar</button>
      <button class="btn quiet" id="pn-x">Cancelar</button></div>`;
    $('#dlg').showModal();
    $('#pn-x').onclick=()=>$('#dlg').close();
    $('#pn-ok').onclick=async()=>{
      const n=($('#pn').value||'').trim();
      if(!n)return toast('Escribe el nombre');
      $('#dlg').close();
      await guardarLista(()=>DB.personas.push({id:uid(),area:SES.area,nombre:n,ts:Date.now()}));
      toast(n+' agregado(a) al área');
    };
    return;
  }
  if(d.persdel){
    const per=DB.personas.find(x=>x.id===d.persdel);if(!per)return;
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='✓?';setTimeout(()=>{b.removeAttribute('data-sure');b.textContent='✕'},3000);return;}
    if(SES.personaSel===per.nombre)SES.personaSel=null;
    return guardarLista(()=>{per.eliminada=true});
  }
  if(d.tcheck){
    if(SES.perfil!=='sensor')return;   /* solo los sensores marcan; el emprendedor es visualizador */
    const t=DB.tareas.find(x=>x.id===d.tcheck);if(!t)return;
    if(t.tipoTarea==='dia')return marcarTarea(t.id,SES.area,hoyIso(),SES.personaSel||t.resp||'');
    const gente=personasDe(SES.area);
    if(gente.length&&!SES.personaSel&&!hecha(t.id,hoyIso())){
      if(t.resp)return marcarTarea(t.id,SES.area,hoyIso(),t.resp);  /* asignada por el emprendedor */
      return toast('Primero toca quién la hizo');
    }
    return marcarTarea(t.id,SES.area,hoyIso(),SES.personaSel||'');
  }
  if(b.id==='tar-editar'){SES.editandoTareas=!SES.editandoTareas;return render();}
  if(b.id==='tar-add'){
    const txt=($('#tar-nueva').value||'').trim();
    if(!txt)return toast('Escribe la tarea');
    const orden=(tareasDe(SES.area).slice(-1)[0]||{orden:0}).orden+1;
    return guardarLista(()=>DB.tareas.push({id:uid(),area:SES.area,texto:txt,orden,ts:Date.now()}));
  }
  if(d.tdel){
    const t=DB.tareas.find(x=>x.id===d.tdel);if(!t)return;
    return guardarLista(()=>{t.eliminada=true});
  }
  if(d.tsube||d.tbaja){
    const id=d.tsube||d.tbaja, ts=tareasDe(SES.area), i=ts.findIndex(t=>t.id===id);
    const j=d.tsube?i-1:i+1;
    if(i<0||j<0||j>=ts.length)return;
    return guardarLista(()=>{const a=ts[i].orden||i,b2=ts[j].orden||j;ts[i].orden=b2;ts[j].orden=a;});
  }
  if(d.goscroll){const el=document.getElementById(d.goscroll);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(d.gotab){SES.tab=d.gotab;window.scrollTo(0,0);return render();}
  if(b.id==='td-agregar'){
    const area=$('#td-area').value,texto=($('#td-texto').value||'').trim(),resp=$('#td-resp').value||'';
    if(!texto)return toast('Escribe la tarea');
    SES.tdArea=area;SES.tdResp='';SES.tdTexto='';
    toast('Tarea del día asignada'+(resp?' a '+resp:''));
    return guardarLista(()=>DB.tareas.push({id:uid(),area,texto,resp,tipoTarea:'dia',fecha:hoyIso(),ts:Date.now(),creadaPor:'emprendedor'}));
  }
  if(b.id==='emp-editar'){
    /* entrar a edición: se toma una foto de las tareas; nada viaja al servidor
       hasta Guardar cambios */
    SES.empEdit=true;
    SES.empEditBk=JSON.stringify({tareas:DB.tareas});
    SES.empDel=new Set();
    return render();
  }
  if(b.id==='emp-cancelar'){
    if(SES.empEditBk)DB.tareas=JSON.parse(SES.empEditBk).tareas;
    SES.empEdit=false;SES.empDel=new Set();SES.empEditBk=null;
    toast('Cambios descartados');
    return render();
  }
  if(b.id==='emp-guardar'){
    const del=SES.empDel||new Set();
    DB.tareas.forEach(t=>{if(del.has(t.id))t.eliminada=true});
    SES.empEdit=false;render();
    SES.guardando=true;
    const ok=await guardarDB();
    SES.guardando=false;
    if(!ok){
      if(SES.empEditBk)DB.tareas=JSON.parse(SES.empEditBk).tareas;
      SES.empEdit=true;SES.empDel=del;
      toast('No se pudo guardar. Sigues en edición: reintenta.');
      return render();
    }
    SES.empDel=new Set();SES.empEditBk=null;
    toast('Cambios guardados · el equipo ya los ve');
    return render();
  }
  if(d.eted)return dialogoEditarTarea(d.eted);
  if(d.etsube||d.etbaja){
    /* mover: cambio local; se confirma con Guardar cambios */
    const tid=d.etsube||d.etbaja;
    const t=DB.tareas.find(x=>x.id===tid);if(!t)return;
    const lista=tareasDe(t.area);
    const ix=lista.findIndex(x=>x.id===tid);
    const j=d.etsube?ix-1:ix+1;
    if(ix<0||j<0||j>=lista.length)return;
    const otro=lista[j];
    const o=t.orden;t.orden=otro.orden;otro.orden=o;
    return render();
  }
  if(d.etdel){
    /* un solo toque: marca (o desmarca) la eliminación; se aplica al guardar */
    if(!SES.empDel)SES.empDel=new Set();
    if(SES.empDel.has(d.etdel))SES.empDel.delete(d.etdel);
    else SES.empDel.add(d.etdel);
    return render();
  }
  if(d.areadet){
    if(SES.empEdit&&SES.empEditBk)DB.tareas=JSON.parse(SES.empEditBk).tareas;
    SES.empEdit=false;SES.empDel=new Set();SES.empEditBk=null;
    SES.areaDetalle=d.areadet;window.scrollTo(0,0);return render();}
  if(b.id==='fij-volver'){SES.areaDetalle=null;return render();}

  /* descarga del emprendedor: todo, sin filtros */
  if(b.id==='emp-csv'||b.id==='emp-json'){
    const dp=SES.empDescPer||'hoy';
    const rs=DB.registros.filter(r=>dp==='todo'||enPeriodo(r.ts,dp)).sort((a,b2)=>a.ts-b2.ts);
    if(!rs.length)return toast('No hay registros en ese periodo');
    try{
      const sello=(dp==='hoy'?'hoy_':(dp==='semana'?'semana_':'todo_'))+selloArchivo();
      if(b.id==='emp-csv'){
        descargar('fuse-ops_'+sello+'.csv',csvDe(rs,';'),'text/csv');
        toast(rs.length+' registro(s) descargados');
      }else{
        descargar('fuse-ops_'+sello+'.json',JSON.stringify({exportado:new Date().toISOString(),
          periodo:dp,totalRegistros:rs.length,registros:rs,avisos:DB.avisos,consultas:DB.consultas,
          tareas:DB.tareas,personas:DB.personas,checks:DB.checks},null,2),'application/json');
        toast('Respaldo descargado ('+(dp==='todo'?'todo':dp)+')');
      }
    }catch(e){toast('No se pudo generar el archivo: '+String(e.message||e));}
    return;
  }

  /* chat con claude */
  if(b.id==='ch-enviar')return enviarChat();
  if(b.id==='ch-limpiar'){SES.chat=[];SES.chatDraft='';return render();}
  if(d.chsug){SES.chatDraft=d.chsug;return enviarChat();}
  if(d.copiar!=null){
    const m=(SES.chat||[])[Number(d.copiar)];
    if(!m)return;
    return navigator.clipboard.writeText(m.content)
      .then(()=>toast('Respuesta copiada'))
      .catch(()=>toast('No se pudo copiar automáticamente; selecciona el texto y copia manual.'));
  }

  if(b.id==='bs-descargar')return dialogoDescarga();
  if(b.id==='bs-reiniciar')return dialogoReinicio();
  if(d.sugerida){$('#q-texto').value=d.sugerida;return;}
  if(b.id==='q-enviar'){
    const q=$('#q-texto').value.trim();if(!q)return toast('Escribe la pregunta');
    DB.consultas.push({id:uid(),ts:Date.now(),pregunta:q,respuesta:null});
    if(!(await guardarDB())){DB.consultas.pop();return toast('No se pudo enviar. Reintenta.');}
    toast('Pregunta enviada al analista · '+fmt(Date.now()));return render();
  }
  if(d.veraviso)return dialogoAviso(d.veraviso);
  if(d.pregrep)return dialogoPreguntaReporte(d.pregrep);
  if(d.actinc)return dialogoActualizarIncidente(d.actinc);
  if(d.verresp)return dialogoRespuesta(d.verresp);
  if(d.leido){const a=DB.avisos.find(x=>x.id===d.leido);if(a){a.leido=true;await guardarDB();render();}return;}
  if(b.id==='ver-listado')return dialogoListado();
  if(d.abririnc)return dialogoIncidente(d.abririnc);
  if(d.verinc){SES.tab='diaria';render();window.scrollTo(0,0);return dialogoIncidente(d.verinc);}

  /* analista */
  if(d.abrir){SES.verConsulta=d.abrir;SES.avisoFuente='proactivo';SES.avisoRefs=new Set();SES.avisoFiltroArea='';window.scrollTo(0,0);return render();}
  if(b.id==='an-volver'){SES.verConsulta=null;return render();}
  if(b.id==='an-publicar'){
    const c=DB.consultas.find(x=>x.id===d.c);if(!c)return;
    const texto=$('#an-texto').value.trim(),firma=SES.nombre||'Analista';
    if(!texto)return toast('Escribe la respuesta');
    const previa=c.respuesta;
    const su=sustentoActual();
    c.respuesta={ts:Date.now(),texto,firma,nBase:DB.registros.length,
      fuente:su.fuente,sustento:su,refs:su.refs||[]};c.vista=false;
    if(!(await guardarDB())){c.respuesta=previa;return toast('No se pudo publicar. Reintenta.');}
    SES.verConsulta=null;toast('Respuesta publicada · el emprendedor ya la ve');return render();
  }
  if(d.analizar){SES.avisoFuente='actividad';SES.avisoRefs=new Set([d.analizar]);SES.tab='aviso';window.scrollTo(0,0);return render();}
  if(d.avfuente){SES.avisoFuente=d.avfuente;return render();}
  if(d.avf!=null){SES.avisoFiltroArea=d.avf;return render();}
  if(b.id==='av-limpiar-sel'){SES.avisoRefs=new Set();return render();}
  if(b.id==='av-enviar'){
    const texto=$('#av-texto').value.trim(),firma=SES.nombre||'Analista';
    let tipo=$('#av-tipo').value;
    if(tipo==='__otro'){
      tipo=($('#av-tipo-otro').value||'').trim();
      if(!tipo)return toast('Escribe el título del reporte');
    }
    if(!texto)return toast('Escribe el contenido del reporte');
    const su=sustentoActual();
    const refs=su.refs||[];
    const primerInc=refs.map(id=>DB.registros.find(r=>r.id===id)).find(r=>r&&r.tipo==='incidente');
    DB.avisos.push({id:uid(),ts:Date.now(),origen:'analista',tipoAviso:tipo,texto,firma,
      fuente:su.fuente,sustento:su,refs,
      refIncidente:primerInc?primerInc.id:null,leido:false});
    if(!(await guardarDB())){DB.avisos.pop();return toast('No se pudo enviar. Reintenta.');}
    SES.avisoRefs=new Set();SES.avisoFuente='proactivo';
    toast('Reporte enviado al emprendedor');return render();
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='s-foto'&&e.target.files&&e.target.files[0]){
    DRAFT.texto=$('#s-texto').value;
    const archivo=e.target.files[0];
    e.target.value='';   /* permite volver a elegir la misma foto */
    const data=await comprimirFoto(archivo);
    if(data)DRAFT.fotos.push(data);
    else toast('No se pudo procesar esa imagen. Prueba tomándola directo con la cámara.');
    render();return;
  }
  const d=e.target.dataset;
  if(d.estado){
    const r=DB.registros.find(x=>x.id===d.estado);if(!r)return;
    const previo=r.estado;r.estado=e.target.value;
    if(await guardarDB())toast('Incidente marcado como '+r.estado);
    else{r.estado=previo;toast('No se pudo guardar el cambio. Reintenta.');}
    render();return;
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='td-area'){SES.tdArea=e.target.value;SES.tdResp='';return render();}
  if(e.target.id==='td-resp'){SES.tdResp=e.target.value;return;}
  if(e.target.id==='av-tipo'){
    const w=$('#av-tipo-otro-wrap');
    if(w)w.classList.toggle('hide',e.target.value!=='__otro');
    return;
  }
  const rsel=e.target.dataset&&e.target.dataset.refsel;
  if(rsel){const set=refsSel();if(e.target.checked)set.add(rsel);else set.delete(rsel);render();return;}
  const t=e.target.dataset&&e.target.dataset.tedit;
  if(t){
    const tar=DB.tareas.find(x=>x.id===t);
    const v=(e.target.value||'').trim();
    if(tar&&v&&v!==tar.texto)await guardarLista(()=>{tar.texto=v});
    return;
  }
},true);
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='ch-texto'&&e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();enviarChat();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='td-texto'){SES.tdTexto=e.target.value;return;}
  if(e.target.id==='ch-texto'){SES.chatDraft=e.target.value;return;}
  if(e.target.id==='s-texto')DRAFT.texto=e.target.value;
  if(e.target.id==='s-transc')DRAFT.transcript=e.target.value;
});
</script>
