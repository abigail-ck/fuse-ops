<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --canvas:#F4F5F8; --surface:#fff; --surface-2:#FAFBFC;
  --ink:#131726; --ink-2:#3A425B; --muted:#737D94;
  --line:#E3E6EE; --line-2:#EEF0F5;
  --azul:#2B3E8F; --azul-soft:#EDF0FB;
  --ambar:#B47614; --ambar-soft:#FBF3E2;
  --rojo:#C0392B; --rojo-soft:#FCEEEC;
  --verde:#12795A; --verde-soft:#E9F5F0;
  --display:'Archivo',sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:15px}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:5px}
.hide{display:none!important}
h1{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.3px;margin:0 0 4px}
h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 3px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:11.5px} .mono{font-family:var(--mono)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card.critico{border-color:#EBB6AD;box-shadow:0 1px 2px rgba(192,57,43,.08),0 10px 24px -18px rgba(192,57,43,.55)}
.card.resuelto{opacity:.72}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2);margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--canvas);color:var(--muted);border:1px solid var(--line)}
.chip.azul{background:var(--azul-soft);color:var(--azul);border-color:#D7DEF6}
.chip.rojo{background:var(--rojo-soft);color:var(--rojo);border-color:#F3D3CE}
.chip.verde{background:var(--verde-soft);color:var(--verde);border-color:#CFE7DE}
.chip.ambar{background:var(--ambar-soft);color:var(--ambar);border-color:#EEDFBD}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 14px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#242b47}
.btn.rec{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
textarea{resize:vertical}
.req{color:var(--rojo)}
.seg{display:flex;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px;background:var(--canvas)}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 10px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg.prio button[aria-pressed="true"].p-alta{background:var(--rojo)}
.seg.prio button[aria-pressed="true"].p-media{background:var(--ambar)}
.seg.prio button[aria-pressed="true"].p-baja{background:var(--ink)}

/* gate */
#gate{min-height:100vh;background:linear-gradient(165deg,#151B36,#22306A);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-in{width:100%;max-width:560px}
.gbrand{font-family:var(--display);font-weight:700;font-size:19px}
.gbrand em{font-style:normal;color:#F0C15F}
.gh{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,31px);letter-spacing:-.6px;margin:18px 0 6px;line-height:1.15}
.gp{color:#C4CCE7;margin:0 0 22px;font-size:14px}
.gcards{display:grid;gap:10px}
.gcard{text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.17);color:#fff;border-radius:13px;padding:16px;cursor:pointer}
.gcard:hover{background:rgba(255,255,255,.13)}
.gcard b{font-family:var(--display);font-size:16px;font-weight:600;display:block;margin-bottom:3px}
.gcard span{font-size:13px;color:#C4CCE7}
.gback{background:none;border:0;color:#C4CCE7;font-size:13px;cursor:pointer;padding:0;margin-top:16px}
.gback:hover{color:#fff}
.gate label.f>span{color:#9AA6D4}
.gate input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.gate input::placeholder{color:#8B96C4}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-weight:700;font-size:15.5px}
.logo em{font-style:normal;color:var(--azul)}
.top .spacer{flex:1}
.uchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 5px;background:var(--surface);cursor:pointer;font-size:12.5px;max-width:52vw}
.uchip .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;background:var(--azul);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;font-family:var(--mono);flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:760px;margin:0 auto;padding:8px 14px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;color:var(--ink-2);cursor:pointer}
.tabs button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* vivo */
.vivo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--verde)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,121,90,.4)}50%{box-shadow:0 0 0 6px rgba(18,121,90,0)}}
.nueva{animation:slide .5s ease}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.inc .top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inc .stamp{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fotos img{width:86px;height:86px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer}
.fotos .quitar{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--rojo);color:#fff;border:0;font-size:12px;cursor:pointer;line-height:1}
.foto-w{position:relative}
audio{width:100%;margin-top:8px;height:38px}
.transc{background:var(--azul-soft);border:1px solid #D7DEF6;border-radius:9px;padding:10px 12px;margin-top:8px;font-size:13px}
.transc .eyebrow{color:var(--azul);margin-bottom:3px}
.aviso-lig{background:var(--ambar-soft);border:1px solid #EEDFBD;border-radius:9px;padding:10px 12px;margin-top:8px;font-size:13px}
.aviso-lig .eyebrow{color:var(--ambar);margin-bottom:3px}

.rec-live{display:flex;align-items:center;gap:10px;background:var(--rojo-soft);border:1px solid #F3D3CE;border-radius:9px;padding:10px 12px;margin-top:8px}
.rec-live i{width:10px;height:10px;border-radius:50%;background:var(--rojo);animation:pulse 1.4s infinite}
.rec-live .t{font-family:var(--mono);font-size:14px;color:var(--rojo)}

.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);margin-bottom:12px}
.tot>div{padding:11px 13px;border-right:1px solid var(--line-2)}
.tot>div:last-child{border-right:0}
.tot .v{font-family:var(--display);font-weight:600;font-size:18px}
.tot .l{font-size:11px;color:var(--muted)}
.sec{display:flex;align-items:baseline;gap:10px;margin:20px 2px 9px}
.sec .eyebrow{flex:1}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.fchips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.qa-q{background:var(--azul-soft);border:1px solid #D7DEF6;border-radius:12px 12px 12px 3px;padding:11px 13px;margin-bottom:8px}
.qa-r{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 3px 12px;padding:11px 13px;margin:0 0 8px 18px;white-space:pre-wrap}
.aviso{border-left:3px solid var(--azul);padding-left:11px}
.aviso.noleido{background:var(--azul-soft);border-radius:0 9px 9px 0;padding:10px 12px 10px 11px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-size:13px;padding:11px 17px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100vw - 24px);box-shadow:0 24px 60px -20px rgba(17,21,36,.45)}
dialog::backdrop{background:rgba(17,21,36,.5)}
.dlg-in{padding:18px}
dialog img.full{width:100%;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* =====================================================================
   FUSE OPS · Registro de Actividad → base central → emprendedor y analista
   Capa de datos v3:
   - TODO lo liviano vive en UNA sola clave (fuse-ops-db-v3): registros sin
     adjuntos, consultas y avisos. 1 lectura por refresco, 1 escritura por
     acción → sin lluvia de peticiones que dispare límites de tasa.
   - Los adjuntos (fotos/audio) van en su propia clave por registro
     (fuse-ops-media-<id>) y se cargan bajo demanda, con caché.
   - Toda escritura reintenta hasta 3 veces con espera creciente.
   ===================================================================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dormir=ms=>new Promise(r=>setTimeout(r,ms));
const AREAS={tienda:'Tienda / Despacho',prod:'Producción · Serigrafía',web:'Ventas Web'};
const SENSOR={tienda:'Sensor Tienda / Despacho',prod:'Sensor Producción',web:'Sensor Ventas Web'};
const AV={tienda:'T',prod:'P',web:'W'};
const K_DB='fuse-ops-db-v3', K_MEDIA='fuse-ops-media-';
const PRIO={alta:0,media:1,baja:2};
const TIPOS_AVISO=['Recomendación de mejora','Riesgo detectado','Tendencia identificada','Alerta preventiva','Resumen ejecutivo'];
const ESTADOS_INC=['abierto','revisado','resuelto'];

const iso=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hoyIso=()=>iso(Date.now());
function fmt(ts){
  const d=new Date(ts),h=pad(d.getHours())+':'+pad(d.getMinutes());
  if(iso(ts)===hoyIso())return 'Hoy '+h;
  const ayer=new Date();ayer.setDate(ayer.getDate()-1);
  if(iso(ts)===iso(ayer))return 'Ayer '+h;
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+h;
}

/* ---------- estado ---------- */
let DB={registros:[],consultas:[],avisos:[]};
const MEDIA=new Map();           // id → {fotos,audio} | 'cargando' | 'error'
const SES={perfil:null,area:null,nombre:null,tab:null,filtro:'',filtroTipo:'',verConsulta:null,
  ultRefresco:0,nuevas:new Set(),avisoRef:null,ultimoEnvio:0,guardando:false};
const DRAFT={tipo:'actividad',prioridad:'media',texto:'',fotos:[],audio:null,transcript:'',grabando:false};
let toastT=null;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800);}

/* ---------- almacenamiento con detección de entorno y respaldos ----------
   0) API remota /api/db (desplegado en Vercel + Upstash Redis): base COMPARTIDA
      entre dispositivos y personas — el modo para producción/demo real.
   1) window.storage (visor de artefactos de Claude)
   2) localStorage (archivo abierto en un navegador normal)
   3) memoria de la pestaña (último recurso; se avisa que no persiste)      */
let MODO='detectando';
const MEMORIA=new Map();
async function probarRemoto(){
  try{
    if(typeof location==='undefined'||!/^https?:$/.test(location.protocol))return false;
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),3500);
    const r=await fetch('api/db',{signal:ctl.signal});clearTimeout(t);
    if(!r.ok)return false;
    const j=await r.json();
    return !!(j&&typeof j==='object'&&Array.isArray(j.registros));
  }catch(e){return false}
}
async function probarAlmacen(){
  if(await probarRemoto()){MODO='remoto';return;}
  try{
    if(window.storage&&typeof window.storage.set==='function'){
      const k='fuse-ops-probe';
      const r=await window.storage.set(k,'1',false);
      if(r){
        try{await window.storage.delete(k,false)}catch(e){}
        MODO='claude';return;
      }
    }
  }catch(e){}
  try{
    const k='fuse-ops-probe';
    localStorage.setItem(k,'1');
    if(localStorage.getItem(k)==='1'){localStorage.removeItem(k);MODO='local';return;}
  }catch(e){}
  MODO='memoria';
}
const almacenListo=probarAlmacen().then(()=>{
  if(MODO==='memoria')toast('Sin almacenamiento disponible: modo demostración, los datos viven solo en esta pestaña.');
});
async function rawGet(k){
  if(MODO==='remoto'){
    const url=k===K_DB?'api/db':'api/media?id='+encodeURIComponent(k.slice(K_MEDIA.length));
    const r=await fetch(url);
    if(r.status===404)return null;
    if(!r.ok)throw new Error('remoto '+r.status);
    return await r.text();
  }
  if(MODO==='claude'){const r=await window.storage.get(k,false);return r&&r.value!=null?r.value:null;}
  if(MODO==='local')return localStorage.getItem(k);
  return MEMORIA.has(k)?MEMORIA.get(k):null;
}
async function rawSet(k,json){
  if(MODO==='remoto'){
    const url=k===K_DB?'api/db':'api/media?id='+encodeURIComponent(k.slice(K_MEDIA.length));
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:json});
    if(!r.ok)throw new Error('remoto '+r.status);
    /* el servidor fusiona y devuelve la base resultante: adoptarla evita pisar
       lo que otro perfil guardó un segundo antes */
    if(k===K_DB){try{const j=await r.json();if(j&&Array.isArray(j.registros))DB=j;}catch(e){}}
    return true;
  }
  if(MODO==='claude')return !!(await window.storage.set(k,json,false));
  if(MODO==='local'){localStorage.setItem(k,json);return localStorage.getItem(k)===json;}
  MEMORIA.set(k,json);return true;
}
async function sGet(k){
  await almacenListo;
  for(let i=0;i<3;i++){
    try{const v=await rawGet(k);return v?JSON.parse(v):null}
    catch(e){
      const msg=String(e&&e.message||e).toLowerCase();
      if(msg.includes('not found')||msg.includes('404'))return null;
      await dormir(350*(i+1));
    }
  }
  return null;
}
async function sSet(k,v){
  await almacenListo;
  const json=JSON.stringify(v);
  for(let i=0;i<3;i++){
    try{if(await rawSet(k,json))return true}
    catch(e){}
    await dormir(400*(i+1));
  }
  /* si el modo Claude falla de forma persistente, degradar a localStorage y no perder el dato */
  if(MODO==='claude'){
    try{
      localStorage.setItem('fuse-ops-probe','1');localStorage.removeItem('fuse-ops-probe');
      MODO='local';
      localStorage.setItem(k,json);
      toast('El almacenamiento del visor falló: seguimos guardando en este navegador.');
      return true;
    }catch(e){}
  }
  return false;
}
/* sincronización entre pestañas cuando el respaldo es localStorage */
try{window.addEventListener('storage',ev=>{if(ev&&ev.key===K_DB)refrescoVivo();});}catch(e){}
async function cargarDB(){const v=await sGet(K_DB);if(v)DB={registros:[],consultas:[],avisos:[],...v};}
async function guardarDB(){return sSet(K_DB,DB);}

/* ---------- registros ---------- */
async function guardarRegistro(reg,media){
  /* 1) el texto SIEMPRE entra: el registro liviano va a la clave única */
  reg.nFotos=media&&media.fotos?media.fotos.length:0;
  reg.hasAudio=!!(media&&media.audio);
  DB.registros.push(reg);
  /* alerta automática si es incidente de prioridad alta (misma escritura) */
  if(reg.tipo==='incidente'&&reg.prioridad==='alta'){
    DB.avisos.push({id:uid(),ts:reg.ts,origen:'sistema',tipoAviso:'Alerta preventiva',
      texto:'Incidente de prioridad ALTA en '+AREAS[reg.area]+': '+(reg.texto||reg.transcript||'ver detalle en Incidentes').slice(0,140),
      firma:'Regla automática',refIncidente:reg.id,leido:false});
  }
  const okDB=await guardarDB();
  if(!okDB){DB.registros=DB.registros.filter(r=>r.id!==reg.id);
    DB.avisos=DB.avisos.filter(a=>a.refIncidente!==reg.id);return {ok:false};}
  /* 2) los adjuntos van aparte; si fallan, el registro ya está a salvo */
  if(reg.nFotos||reg.hasAudio){
    const okM=await sSet(K_MEDIA+reg.id,{fotos:media.fotos||[],audio:media.audio||null});
    if(okM){MEDIA.set(reg.id,{fotos:media.fotos||[],audio:media.audio||null});return {ok:true,media:true};}
    reg.mediaPerdida=true;await guardarDB();
    return {ok:true,media:false};
  }
  return {ok:true,media:true};
}

function comprimirFoto(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=720,e_=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*e_);c.height=Math.round(img.height*e_);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.62));
      URL.revokeObjectURL(img.src);
    };
    img.onerror=()=>res(null);
    img.src=URL.createObjectURL(file);
  });
}
let mediaRec=null,recChunks=[],recStream=null,recStart=0,recTick=null,recog=null,recogFinal='';
async function iniciarGrabacion(){
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){return toast('No se pudo acceder al micrófono. Revisa los permisos del navegador.');}
  recChunks=[];recogFinal=DRAFT.transcript?DRAFT.transcript+' ':'';
  mediaRec=new MediaRecorder(recStream);
  mediaRec.ondataavailable=ev=>{if(ev.data.size)recChunks.push(ev.data)};
  mediaRec.onstop=()=>{
    const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
    const fr=new FileReader();
    fr.onload=()=>{DRAFT.audio={data:fr.result,dur:Math.round((Date.now()-recStart)/1000)};DRAFT.grabando=false;render();};
    fr.readAsDataURL(blob);
    recStream.getTracks().forEach(t=>t.stop());
  };
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    recog=new SR();recog.lang='es-PE';recog.continuous=true;recog.interimResults=true;
    recog.onresult=ev=>{
      let interim='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        if(ev.results[i].isFinal)recogFinal+=ev.results[i][0].transcript+' ';
        else interim+=ev.results[i][0].transcript;
      }
      DRAFT.transcript=(recogFinal+interim).trim();
      const el=$('#tr-live');if(el)el.textContent=DRAFT.transcript||'…';
    };
    try{recog.start()}catch(e){}
  }
  DRAFT.grabando=true;recStart=Date.now();
  mediaRec.start();
  recTick=setInterval(()=>{
    const el=$('#rec-t');const s=Math.round((Date.now()-recStart)/1000);
    if(el)el.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
    if(s>=120)detenerGrabacion();
  },300);
  render();
}
function detenerGrabacion(){
  clearInterval(recTick);
  if(recog){try{recog.stop()}catch(e){}recog=null;}
  if(mediaRec&&mediaRec.state!=='inactive')mediaRec.stop();
}

function statsBase(dias){
  const desde=Date.now()-(dias||7)*86400000;
  const rs=lista().filter(i=>i.ts>=desde);
  const por={};Object.keys(AREAS).forEach(a=>por[a]=rs.filter(i=>i.area===a).length);
  const incs=rs.filter(r=>r.tipo==='incidente');
  const stop=new Set('de la el en los las que una uno con por para del sin muy hay fue este esta hoy ayer mas más pero como cuando donde tiene hacer se un al lo su ya no si es era son están esta estaba'.split(' '));
  const freq={};
  rs.forEach(i=>String((i.texto||'')+' '+(i.transcript||'')).toLowerCase().replace(/[^a-záéíóúñü\s]/g,' ').split(/\s+/)
    .filter(w=>w.length>3&&!stop.has(w)).forEach(w=>freq[w]=(freq[w]||0)+1));
  const top=Object.entries(freq).filter(e=>e[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return {rs,por,top,incs};
}

  const cs=DB.consultas.slice().sort((a,b)=>(a.respuesta?1:0)-(b.respuesta?1:0)||b.ts-a.ts);

    const c=DB.consultas.find(x=>x.id===SES.verConsulta);
    if(c)return vAnResponder(c);
    SES.verConsulta=null;
  }
  return `<div class="card"><h1>Consultas del emprendedor</h1>
    <div class="sm muted">Responde con la base de registros como única fuente. Cada respuesta queda firmada y fechada.</div></div>
  ${cs.length?cs.map(c=>`<div class="card">
    <div class="top-r" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="chip ${c.respuesta?'verde':'ambar'}">${c.respuesta?'Respondida':'Pendiente'}</span>
      <span class="stamp mono xs muted" style="margin-left:auto">${fmt(c.ts)}</span></div>
    <div class="sm" style="margin-top:6px;font-weight:600">${esc(c.pregunta)}</div>
    ${c.respuesta?`<div class="xs muted" style="margin-top:4px">Respondida ${fmt(c.respuesta.ts)} por ${esc(c.respuesta.firma)}</div>`:''}
    <div class="actions"><button class="btn ${c.respuesta?'':'primary'}" data-abrir="${c.id}">${c.respuesta?'Ver / responder de nuevo':'Responder'}</button></div>
  </div>`).join(''):'<div class="empty">No hay consultas todavía.</div>'}`;
}
function statsHtml(){
  const st=statsBase(7);
  return `<div class="card">
    <div class="eyebrow" style="margin-bottom:8px">Lo que dice la base (últimos 7 días)</div>
    <div class="tot" style="margin-bottom:8px">
      <div><div class="v">${st.rs.length}</div><div class="l">Registros</div></div>
      <div><div class="v">${st.incs.length}</div><div class="l">Incidentes</div></div>
      ${Object.keys(AREAS).map(a=>`<div><div class="v">${st.por[a]}</div><div class="l">${AREAS[a].split(' ')[0]}</div></div>`).join('')}
    </div>
    ${st.top.length?`<div class="xs muted" style="margin-bottom:4px">Términos que se repiten:</div>
      <div class="fchips" style="margin:0">${st.top.map(t=>`<button disabled style="cursor:default">${esc(t[0])} · ${t[1]}</button>`).join('')}</div>`
      :'<div class="xs muted">Aún no hay términos repetidos (base muy chica).</div>'}
  </div>`;
}

  <div class="card"><div class="eyebrow">Consulta · ${fmt(c.ts)}</div>
    <h2 style="margin-top:4px">${esc(c.pregunta)}</h2></div>
  ${statsHtml()}
  <div class="card">
    <label class="f"><span>Tu respuesta <i class="req">*</i></span>
      <textarea id="an-texto" rows="8" placeholder="Análisis, tendencias y recomendaciones sustentadas en los registros">${esc(c.borrador||'')}</textarea></label>
    <div class="actions">
      <button class="btn" id="an-ia" data-c="${c.id}">Redactar borrador con IA (usa la base)</button>
      <span class="xs muted" id="an-ia-estado"></span>

    <label class="f" style="margin-top:10px"><span>Firma <i class="req">*</i></span><input id="an-firma" value="${esc(SES.nombre||'')}"></label>
    <div class="actions">
      <button class="btn primary" id="an-publicar" data-c="${c.id}">Publicar respuesta</button>
      <span class="xs muted">Le llega al emprendedor con tu firma y la cantidad de registros usados.</span>
    </div></div>`;
}
function vAnAviso(){
  const ref=SES.avisoRef?DB.registros.find(r=>r.id===SES.avisoRef):null;
  const enviados=DB.avisos.filter(a=>a.origen==='analista').sort((a,b)=>b.ts-a.ts);
  return `<div class="card">
    <h1>Enviar aviso al emprendedor</h1>
    <div class="sm muted">Tu rol no es solo responder: cuando detectes un patrón, un riesgo o una oportunidad en la base, avísale sin esperar a que pregunte. Llega a su Centro de alertas.</div>
  </div>
  ${ref?`<div class="card" style="border-color:#EEDFBD;background:#FFFEFA">
    <div class="eyebrow" style="color:var(--ambar);margin-bottom:6px">Este aviso quedará vinculado a un incidente</div>

    <button class="btn quiet" id="av-quitar-ref">Quitar vínculo</button>

  ${statsHtml()}
  <div class="card">
    <label class="f"><span>Tipo de aviso <i class="req">*</i></span>
      <select id="av-tipo">${TIPOS_AVISO.map(t=>`<option ${ref&&t==='Recomendación de mejora'?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="f"><span>Contenido <i class="req">*</i></span>
      <textarea id="av-texto" rows="7" placeholder="Qué detectaste en la base, con sus conteos, y qué recomiendas hacer"></textarea></label>
    <div class="actions">

      <span class="xs muted" id="av-ia-estado"></span>
    </div>
    <label class="f" style="margin-top:10px"><span>Firma <i class="req">*</i></span><input id="av-firma" value="${esc(SES.nombre||'')}"></label>
    <div class="actions">
      <button class="btn primary" id="av-enviar">Enviar al Centro de alertas</button>
    </div>
  </div>
  <div class="sec"><span class="eyebrow">Avisos que enviaste</span></div>
  ${enviados.length?enviados.map(a=>`<div class="card">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="chip azul">${esc(a.tipoAviso)}</span>
      ${a.leido?'<span class="chip verde">Leído</span>':'<span class="chip ambar">Sin leer</span>'}
      <span class="stamp mono xs muted" style="margin-left:auto">${fmt(a.ts)}</span></div>
    <div class="sm" style="margin-top:6px;white-space:pre-wrap">${esc(a.texto)}</div>
    ${a.refIncidente?'<div class="xs muted" style="margin-top:4px">Vinculado a un incidente.</div>':''}
  </div>`).join(''):'<div class="empty">Aún no envías avisos.</div>'}`;
}
function vAnBase(){
  const todos=lista().filter(r=>(!SES.filtro||r.area===SES.filtro)&&(!SES.filtroTipo||r.tipo===SES.filtroTipo)).sort((a,b)=>b.ts-a.ts);
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h1 style="flex:1;margin:0">Base de registros</h1>
      <span class="vivo"><i></i>EN VIVO · <span id="vivo-t">hace 0 s</span></span>
    </div>
    <div class="sm muted" style="margin-top:4px">Solo lectura. Es la única fuente para tus análisis y avisos. Desde cada incidente puedes abrir un análisis vinculado.</div></div>
  <div class="fchips">
    <button data-fa="" aria-pressed="${SES.filtro===''}">Todas las áreas</button>
    ${Object.keys(AREAS).map(a=>`<button data-fa="${a}" aria-pressed="${SES.filtro===a}">${AREAS[a]}</button>`).join('')}
  </div>
  <div class="fchips">
    <button data-ft="" aria-pressed="${SES.filtroTipo===''}">Todo</button>
    <button data-ft="incidente" aria-pressed="${SES.filtroTipo==='incidente'}">Incidentes</button>
    <button data-ft="actividad" aria-pressed="${SES.filtroTipo==='actividad'}">Actividades</button>
  </div>
  ${todos.length?todos.map(r=>cardReg(r,{analizar:r.tipo==='incidente'})).join(''):'<div class="empty">La base está vacía o no hay registros con estos filtros.</div>'}`;
}

/* ---------- borradores con IA real, alimentados por la base ---------- */
function serializarBase(){
  return lista().slice(-120).map(i=>`[${iso(i.ts)} ${pad(new Date(i.ts).getHours())}:${pad(new Date(i.ts).getMinutes())}] TIPO=${i.tipo}${i.tipo==='incidente'?(' PRIORIDAD='+i.prioridad+' ESTADO='+i.estado):''} ÁREA=${AREAS[i.area]} PERSONA=${i.persona} TEXTO=${(i.texto||'').replace(/\n/g,' ')} AUDIO_TRANSCRITO=${(i.transcript||'').replace(/\n/g,' ')} FOTOS=${i.nFotos||0}`).join('\n');
}
async function llamarIA(prompt){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
  const data=await r.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}
const REGLAS_IA=`Redacta en español peruano claro y directo, texto plano sin Markdown. Reglas estrictas:
- Usa SOLO lo que está en la base; cita conteos y fechas concretas.
- Señala frecuencias, repeticiones y comparaciones entre áreas cuando existan.
- Cierra con recomendaciones accionables derivadas de esos datos.
- Si la base no alcanza, dilo explícitamente y sugiere qué registros faltan.
- Máximo ~200 palabras.`;
async function borradorConsulta(c){
  const est=$('#an-ia-estado'),btn=$('#an-ia');
  if(!lista().length){est.textContent='La base está vacía: no hay nada que analizar.';return;}
  btn.disabled=true;est.textContent='Leyendo la base y redactando…';
  try{
    const texto=await llamarIA(`Eres el asistente de un analista de operaciones de una PyME. Tu ÚNICA fuente es esta base de registros (actividades e incidentes) con fecha y hora reales:\n\n${serializarBase()}\n\nPregunta del emprendedor: "${c.pregunta}"\n\n${REGLAS_IA}`);
    if(!texto)throw new Error('vacío');
    $('#an-texto').value=texto;c.borrador=texto;
    est.textContent='Borrador listo. Revísalo y ajústalo antes de firmar: la respuesta es tuya.';
  }catch(e){est.textContent='No se pudo generar el borrador. Redáctalo a mano con las cifras de arriba.';}
  btn.disabled=false;
}
async function borradorAviso(){
  const est=$('#av-ia-estado'),btn=$('#av-ia');
  if(!lista().length){est.textContent='La base está vacía: no hay nada que analizar.';return;}
  btn.disabled=true;est.textContent='Leyendo la base y redactando…';
  const tipo=$('#av-tipo').value;
  const ref=SES.avisoRef?DB.registros.find(r=>r.id===SES.avisoRef):null;
  try{
    const texto=await llamarIA(`Eres el asistente de un analista de operaciones de una PyME. Tu ÚNICA fuente es esta base de registros (actividades e incidentes):\n\n${serializarBase()}\n\n${ref?`El aviso debe centrarse en este incidente específico: [${iso(ref.ts)}] ÁREA=${AREAS[ref.area]} PRIORIDAD=${ref.prioridad} TEXTO=${ref.texto||ref.transcript}\n\n`:''}Redacta un aviso proactivo del tipo "${tipo}" para el dueño del negocio, sin que él lo haya pedido.\n\n${REGLAS_IA}`);
    if(!texto)throw new Error('vacío');
    $('#av-texto').value=texto;
    est.textContent='Borrador listo. Ajústalo antes de enviar: el aviso sale con tu firma.';
  }catch(e){est.textContent='No se pudo generar el borrador. Redáctalo a mano con las cifras de arriba.';}
  btn.disabled=false;
}

/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
const TABS={
  sensor:[['reportar','Registro de Actividad']],
  emprendedor:[['incidentes','Incidentes'],['actividades','Actividades'],['alertas','Centro de alertas'],['preguntar','Preguntar al Analista']],
  analista:[['consultas','Consultas'],['aviso','Enviar aviso'],['base','Base de registros']]
};
function badges(k){
  if(SES.perfil==='emprendedor'){
    if(k==='incidentes')return incidentes().filter(r=>r.estado!=='resuelto'&&r.prioridad==='alta').length;
    if(k==='alertas')return DB.avisos.filter(a=>!a.leido).length;
    if(k==='preguntar')return DB.consultas.filter(c=>c.respuesta&&!c.vista).length;
  }
  if(SES.perfil==='analista'&&k==='consultas')return DB.consultas.filter(c=>!c.respuesta).length;
  return 0;
}
function render(){
  if(!SES.perfil)return;
  const tabs=TABS[SES.perfil];
  if(!SES.tab)SES.tab=tabs[0][0];
  $('#uav').textContent=SES.perfil==='sensor'?AV[SES.area]:(SES.perfil==='analista'?'A':'E');
  $('#uwho').textContent=SES.perfil==='sensor'?SES.nombre+' · '+SENSOR[SES.area]
    :(SES.perfil==='analista'?'Analista · '+SES.nombre:'Emprendedor');
  $('#tabs').innerHTML=tabs.length>1?tabs.map(t=>{const b=badges(t[0]);
    return `<button data-tab="${t[0]}" aria-current="${t[0]===SES.tab}">${t[1]}${b?' · '+b:''}</button>`}).join(''):'';
  const V={'sensor/reportar':vSensor,
    'emprendedor/incidentes':vEmpIncidentes,'emprendedor/actividades':vEmpActividades,
    'emprendedor/alertas':vEmpAlertas,'emprendedor/preguntar':vEmpPreguntar,
    'analista/consultas':vAnConsultas,'analista/aviso':vAnAviso,'analista/base':vAnBase};
  $('#view').innerHTML=V[SES.perfil+'/'+SES.tab]();
  SES.nuevas.clear();
  if(SES.perfil!=='sensor')cargarMediaPendiente();
}
async function entrar(perfil){
  SES.perfil=perfil;SES.tab=null;SES.verConsulta=null;SES.avisoRef=null;
  $('#gate').classList.add('hide');$('#app').classList.remove('hide');
  window.scrollTo(0,0);
  await cargarDB();
  if(MODO==='remoto'&&!SES.avisadoModo){SES.avisadoModo=true;toast('Conectado a la base compartida · todos los perfiles ven lo mismo');}
  SES.ultRefresco=Date.now();
  if(perfil==='emprendedor'){DB.consultas.forEach(c=>{if(c.respuesta)c.vista=true});}
  render();
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('click',async e=>{
  const img=e.target.closest('img[data-verfoto],img[data-ampliar]');
  if(img){
    $('#dlg-in').innerHTML=`<img class="full" src="${img.src}" alt="Foto del registro"><div class="actions"><button class="btn" id="dlg-x">Cerrar</button></div>`;
    $('#dlg').showModal();$('#dlg-x').onclick=()=>$('#dlg').close();return;
  }
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;

  /* gate */
  if(d.g==='sensor'){$('#g1').classList.add('hide');$('#g2').classList.remove('hide');return;}
  if(d.g==='analista'){$('#g1').classList.add('hide');$('#g3').classList.remove('hide');return;}
  if(d.g==='emprendedor')return entrar('emprendedor');
  if(d.back){$('#g2').classList.add('hide');$('#g3').classList.add('hide');$('#g1').classList.remove('hide');return;}
  if(d.sensor){const n=$('#g-nombre').value.trim();if(!n)return toast('Escribe tu nombre debajo de los sensores');
    SES.area=d.sensor;SES.nombre=n;return entrar('sensor');}
  if(b.id==='g-entrar-an'){const n=$('#g-nombre-an').value.trim();if(!n)return toast('Escribe tu nombre');
    SES.nombre=n;return entrar('analista');}
  if(b.id==='switch'){
    if(DRAFT.grabando)detenerGrabacion();
    SES.perfil=null;$('#app').classList.add('hide');$('#gate').classList.remove('hide');
    $('#g2').classList.add('hide');$('#g3').classList.add('hide');$('#g1').classList.remove('hide');window.scrollTo(0,0);return;}
  if(d.tab){SES.tab=d.tab;SES.verConsulta=null;window.scrollTo(0,0);return render();}

  /* sensor */
  if(d.tipo){DRAFT.texto=$('#s-texto')?$('#s-texto').value:DRAFT.texto;DRAFT.tipo=d.tipo;return render();}
  if(d.prio){DRAFT.texto=$('#s-texto')?$('#s-texto').value:DRAFT.texto;DRAFT.prioridad=d.prio;return render();}
  if(b.id==='s-grabar')return iniciarGrabacion();
  if(b.id==='s-stop')return detenerGrabacion();
  if(b.id==='s-regrabar'){DRAFT.audio=null;return render();}
  if(d.qfoto!=null){DRAFT.texto=$('#s-texto').value;DRAFT.fotos.splice(Number(d.qfoto),1);return render();}
  if(b.id==='s-enviar')return enviarRegistro();

  /* filtros compartidos */
  if(d.fa!=null){SES.filtro=d.fa;return render();}
  if(d.ft!=null){SES.filtroTipo=d.ft;return render();}

  /* emprendedor */
  if(d.sugerida){$('#q-texto').value=d.sugerida;return;}
  if(b.id==='q-enviar'){
    const q=$('#q-texto').value.trim();if(!q)return toast('Escribe la pregunta');
    DB.consultas.push({id:uid(),ts:Date.now(),pregunta:q,respuesta:null});
    if(!(await guardarDB())){DB.consultas.pop();return toast('No se pudo enviar. Reintenta.');}
    toast('Pregunta enviada al analista · '+fmt(Date.now()));return render();
  }
  if(d.leido){const a=DB.avisos.find(x=>x.id===d.leido);if(a){a.leido=true;await guardarDB();render();}return;}
  if(d.verinc){SES.tab='incidentes';render();window.scrollTo(0,0);return;}

  /* analista */
  if(d.abrir){SES.verConsulta=d.abrir;window.scrollTo(0,0);return render();}
  if(b.id==='an-volver'){SES.verConsulta=null;return render();}
  if(b.id==='an-ia'){const c=DB.consultas.find(x=>x.id===d.c);if(c)return borradorConsulta(c);}
  if(b.id==='an-publicar'){
    const c=DB.consultas.find(x=>x.id===d.c);if(!c)return;
    const texto=$('#an-texto').value.trim(),firma=$('#an-firma').value.trim();
    if(!texto)return toast('Escribe la respuesta');
    if(!firma)return toast('Falta tu firma');
    const previa=c.respuesta;
    c.respuesta={ts:Date.now(),texto,firma,nBase:DB.registros.length};c.vista=false;delete c.borrador;
    if(!(await guardarDB())){c.respuesta=previa;return toast('No se pudo publicar. Reintenta.');}
    SES.verConsulta=null;toast('Respuesta publicada · el emprendedor ya la ve');return render();
  }
  if(d.analizar){SES.avisoRef=d.analizar;SES.tab='aviso';window.scrollTo(0,0);return render();}
  if(b.id==='av-quitar-ref'){SES.avisoRef=null;return render();}
  if(b.id==='av-ia')return borradorAviso();
  if(b.id==='av-enviar'){
    const texto=$('#av-texto').value.trim(),firma=$('#av-firma').value.trim(),tipo=$('#av-tipo').value;
    if(!texto)return toast('Escribe el contenido del aviso');
    if(!firma)return toast('Falta tu firma');
    DB.avisos.push({id:uid(),ts:Date.now(),origen:'analista',tipoAviso:tipo,texto,firma,
      refIncidente:SES.avisoRef||null,leido:false});
    if(!(await guardarDB())){DB.avisos.pop();return toast('No se pudo enviar. Reintenta.');}
    SES.avisoRef=null;
    toast('Aviso enviado al Centro de alertas del emprendedor');return render();
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='s-foto'&&e.target.files&&e.target.files[0]){
    DRAFT.texto=$('#s-texto').value;
    const data=await comprimirFoto(e.target.files[0]);
    if(data)DRAFT.fotos.push(data);else toast('No se pudo leer la imagen');
    render();return;
  }
  const d=e.target.dataset;
  if(d.estado){
    const r=DB.registros.find(x=>x.id===d.estado);if(!r)return;
    const previo=r.estado;r.estado=e.target.value;
    if(await guardarDB())toast('Incidente marcado como '+r.estado);
    else{r.estado=previo;toast('No se pudo guardar el cambio. Reintenta.');}
    render();return;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='s-texto')DRAFT.texto=e.target.value;
  if(e.target.id==='s-transc')DRAFT.transcript=e.target.value;
});
